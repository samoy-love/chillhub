<!doctype html>
<html data-bs-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Вход в админку</title>
  <!-- SRI is mandatory here: this is the page that collects the admin password.
       Without integrity=, a compromised or hijacked CDN response would run in
       the same origin as the form and could exfiltrate the credentials.
       Hashes verified byte-identical on both jsdelivr and unpkg. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="/admin/ui/admin.css" rel="stylesheet">
  <link rel="icon" href="/admin/ui/app.ico" type="image/x-icon">
</head>
<body class="bg-body d-flex align-items-center" style="min-height:100vh">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-6 col-lg-4">
        <div class="card">
          <div class="card-header d-flex align-items-center gap-2">
            <img src="/admin/ui/app.ico" class="brand-logo" alt="ChillHub">
            <strong>Вход в админ-панель</strong>
          </div>
          <div class="card-body">
            <form id="loginForm" class="d-flex flex-column gap-3">
              <div>
                <label class="form-label">Логин</label>
                <input id="username" class="form-control" autocomplete="username" required>
              </div>
              <div>
                <label class="form-label">Пароль</label>
                <input id="password" class="form-control" type="password" autocomplete="current-password" required>
              </div>
              <button id="btnLogin" type="submit" class="btn btn-primary w-100">Войти</button>
              <div id="msg" class="small text-body-secondary"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="/admin/ui/login.js"></script>
</body>
</html>
