<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход в панель Chill Hub</title>
<meta name="robots" content="noindex, nofollow">
<!-- Страница входа стоит особняком, и причина не в оформлении. Её
     открывают БЕЗ сессии, а nginx отдаёт анониму лишь несколько файлов
     из /admin/ui/: саму страницу, login.js и значок. Всё остальное —
     admin.css, шрифты, vendor/ — отвечает 401. Поэтому оформление здесь
     лежит прямо в разметке: внешний файл просто не приедет.

     Раньше вместо этого страница брала bootstrap с чужого CDN — на
     странице, которая собирает пароль администратора. Теперь стороннего
     кода на ней нет вовсе, и подменять нечего. -->
<link rel="icon" href="/admin/ui/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/admin/ui/app.ico" type="image/x-icon">
<style>
  :root {
    color-scheme: dark;

    --page: #0e1114;
    --surface: #14181d;
    --surface-3: #212932;
    --line: #242c34;
    --line-2: #353f4a;
    --fg: #dde2e6;
    --fg-2: #98a3ac;
    --ember: #d1663c;
    --ember-hi: #e5825b;
    --on-ember: #140904;
    --bad: #cd6057;
    --r: 3px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--page);
    color: var(--fg);
    font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }

  .card {
    width: 100%;
    max-width: 320px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface);
  }

  .head {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
  }

  .head img { width: 18px; height: 18px; }

  form { display: flex; flex-direction: column; gap: 12px; padding: 18px; }

  label { display: block; margin-bottom: 4px; color: var(--fg-2); }

  input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line-2);
    border-radius: var(--r);
    background: var(--surface-3);
    color: var(--fg);
    font: inherit;
  }

  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--ember-hi);
    outline-offset: 1px;
  }

  button {
    padding: 7px 12px;
    border: 1px solid transparent;
    border-radius: var(--r);
    background: var(--ember);
    color: var(--on-ember);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover:not(:disabled) { background: var(--ember-hi); }
  button:disabled { opacity: 55%; cursor: default; }

  /* Сообщение занимает место всегда: без этого карточка прыгает на
     первой же ошибке, ровно в тот момент, когда её читают. */
  #msg { min-height: 18px; color: var(--fg-2); }
  #msg[data-bad] { color: var(--bad); }
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <img src="/admin/ui/app.ico" alt="">
      <span>Панель Chill Hub</span>
    </div>
    <form id="loginForm">
      <div>
        <label for="username">Логин</label>
        <input id="username" autocomplete="username" required autofocus>
      </div>
      <div>
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="btnLogin" type="submit">Войти</button>
      <div id="msg" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script src="/admin/ui/login.js"></script>
</body>
</html>
