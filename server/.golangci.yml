# ---------------------------------------------------------------------------
# ПОЧЕМУ ЗДЕСЬ ДЛИННЫЙ СПИСОК disable
# ---------------------------------------------------------------------------
# `default: all` — это «включить всё и потом отказываться от лишнего».
# Отказывались ровно один раз, при заведении файла, и с тех пор джоба
# «Go (api + admin)» не была зелёной НИ РАЗУ: 2853 замечания в 43 линтерах,
# больше половины — про пустые строки и длину имён. Линтер, который никто не
# может пройти, перестаёт быть гейтом: его не читают, и настоящие находки
# тонут в шуме. Одна такая нашлась ровно при этой чистке — два обработчика в
# news.go разбирали multipart-форму без http.MaxBytesReader.
#
# Правило для этого файла: линтер остаётся, если его замечание — дефект, а не
# мнение о форматировании. Всё выключенное ниже выключено с причиной. Вернуть
# линтер в строй — нормальное ревьюируемое изменение, но вместе с правками
# кода, а не «включим и разберёмся потом».
# ---------------------------------------------------------------------------

version: "2"
linters:
  default: all
  disable:
    # --- было выключено при заведении файла -------------------------------
    - depguard    # список разрешённых зависимостей не ведётся
    - gocognit    # дублирует cyclop, который остаётся включённым
    - funlen      # длина функции сама по себе не дефект
    - goconst     # повторы строк в тестах и SQL — норма
    - wsl         # пустые строки по схеме
    - wsl_v5      # он же, вторая редакция

    # --- форматирование и стиль -------------------------------------------
    # 1532 замечания на четверых, ни одного бага.
    - nlreturn    # 545: пустая строка перед каждым return
    - varnamelen  # 507: запрещает i, w, r, db — идиоматичные имена Go
    - noinlineerr # 321: запрещает if err := f(); err != nil
    - exhaustruct # 159: требует заполнять все поля любого литерала структуры
    - lll         # длина строки; форматирование делает gofmt
    - godot       # точки в конце комментариев

    # --- мнения об организации кода ---------------------------------------
    - mnd              # 79: любое число в коде объявляется «магическим»
    - wrapcheck        # 63: требует оборачивать каждую чужую ошибку
    - gochecknoglobals # глобальные переменные запрещены как класс
    - gochecknoinits   # init запрещён как класс
    - funcorder        # порядок методов в файле
    - nonamedreturns   # именованные возвраты запрещены как класс
    - ireturn          # «не возвращай интерфейс»; adminutil.FlusherFor обязан
    - godox            # TODO в коде; планы живут в issues, но метка в коде полезна
    - err113           # требует sentinel-ошибку вместо errors.New по месту:
                       # три десятка новых переменных ради формы
    - gosmopolitan     # ругается на кириллицу в строках, а она здесь по делу
    - prealloc         # микрооптимизация append в тестовых сборках
    - unparam          # «параметр всегда получает одно значение» — это про
                       # тестовые хелперы, а не про дефект
    - nestif           # вложенность блоков; та же метрика, что у cyclop

    # --- дубли уже включённых ---------------------------------------------
    - gocyclo     # cyclop считает то же самое и настроен ниже

    # --- тесты -------------------------------------------------------------
    - paralleltest # 338: t.Parallel() в каждом тесте; часть тестов делит БД
    - testpackage  # требует выносить тесты в пакет _test

  settings:
    cyclop:
      # Порог по умолчанию (10) отсекал 52 функции — то есть весь обычный
      # обработчик HTTP с разбором формы и валидацией. Здесь он поднят до
      # реального уровня этого кода: гейт должен ловить ухудшение, а не
      # историю. Всё, что выше, разгружено вручную.
      max-complexity: 20

    staticcheck:
      checks:
        - all
        - -QF1001 # «примени закон де Моргана» — читаемость от этого не растёт

    revive:
      rules:
        - name: unused-parameter
          # Сигнатуру http.HandlerFunc менять нельзя, а переименование r в _
          # в 23 местах ничего не сообщает читателю.
          disabled: true

    gosec:
      excludes:
        # Taint-анализ не видит валидаторов. Все места под этими правилами
        # проверены: gid и ver проходят adminutil.IsSafeGameID/IsSafeVersion
        # до склейки пути, и они же уходят в лог.
        - G703 # path traversal via taint analysis
        - G706 # log injection via taint analysis
        - G304 # file inclusion via variable

        # Права на каталоги и файлы контента (0755/0644). Контент раздаёт сам
        # процесс через http.FileServer, но эти же файлы читают выкатка и
        # бэкап на проде, а их настройки живут в deploy-kit, не здесь.
        # Сужать права вслепую — ронять раздачу; менять их нужно вместе с
        # инфраструктурой, а не правкой линтера.
        - G301
        - G302
        - G306

        # Auth.setCookie выставляет Secure из конфигурации (на localhost
        # схема http), HttpOnly параметром, SameSite=Lax. gosec ждёт
        # литерального true и другого способа не признаёт.
        - G124

        # freespace_windows.go зовёт GetDiskFreeSpaceEx через syscall —
        # unsafe.Pointer там неизбежен и локализован в восьми строках.
        - G103

        # runFFmpegTranscode запускает exec.CommandContext(ctx, exe, args...),
        # где exe берётся из конфигурации, а не из запроса. Аргументы
        # передаются массивом, без оболочки.
        - G204

  exclusions:
    paths:
      - ".*_generated\\.go"
      - admin_ui/*
    rules:
      # Структуры в mods/ раскладывают ОТВЕТЫ Thunderstore, а не наш формат.
      # Имена полей там заданы чужим API (version_number, download_url,
      # is_deprecated); переименовать их в camelCase — сломать разбор, а не
      # улучшить стиль. На НАШИ структуры (ResolvedPackage, Resolution,
      # ProfileMod и всё, что уезжает в манифест) правило продолжает
      # действовать: они лежат в других файлах пакета.
      # gosec отслеживает поток данных и не видит валидаторов, поэтому здесь
      # то же исключение, что уже сделано для G703/G706 в общем списке.
      # G704 (SSRF): URL архива строится из имени пакета, которое перед этим
      # прошло safeFullName — тот же самый guard, что решает, можно ли делать
      # из имени путь на диске. Хост берётся из константы, не из запроса.
      # G120 (разбор формы): каждый обработчик в mods/handlers.go оборачивает
      # тело в http.MaxBytesReader строкой ВЫШЕ вызова ParseForm /
      # ParseMultipartForm — анализатор эту связь не прослеживает.
      - path: internal/adminapi/mods/(client|handlers)\.go
        linters:
          - gosec

      - path: internal/adminapi/mods/(client|catalog)\.go
        linters:
          - tagliatelle

      # Тесты давали 361 замечание из 702, и ни одно не про дефект.
      - path: _test\.go
        linters:
          - gosec          # права 0755 внутри t.TempDir()
          - noctx          # httptest.NewRequest без контекста
          - forcetypeassert # непроверенное приведение типа роняет тест внятно
