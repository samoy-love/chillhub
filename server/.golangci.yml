run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  skip-dirs:
    - admin_ui
  skip-files:
    - ".*_generated\\.go"
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - typecheck
    - gocyclo
issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Allow higher complexity/duplication in tests
    - path: _test\\.go
      linters:
        - gocyclo
        - dupl

linters-settings:
  gocyclo:
    min-complexity: 20
  dupl:
    threshold: 150
  misspell:
    locale: US
  govet:
    check-shadowing: true
