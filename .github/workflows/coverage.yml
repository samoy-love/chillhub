name: Покрытие main

# ЗАЧЕМ ОТДЕЛЬНЫЙ ВОРКФЛОУ, А НЕ ШАГ В ci.yml.
#
# Codecov привязывает отчёт к КОММИТУ, а бейдж и «project»-статус считает по
# ветке по умолчанию. Отчёты из ci.yml приходят на коммиты веток PR — для main
# они не приезжают никогда, потому что ci.yml намеренно ходит только по
# pull_request (см. комментарий к его триггеру).
#
# Пока этого файла не было, данные main стояли на месте: бейдж в README
# показывал цифру того дня, когда CI последний раз запускался на push в main.
#
# ТРИ СЛАГАЕМЫХ, А НЕ ОДНО. В репозитории три независимых набора кода: сервер
# на Go, клиент на C# и браузерный JS (лендинг + морда админки). Пока считался
# один сервер, бейдж отвечал не на тот вопрос, который ему задают.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Мержи иногда идут подряд; предыдущий счёт не нужен, важен последний main.
concurrency:
  group: coverage-main
  cancel-in-progress: true

jobs:
  server:
    name: Покрытие сервера в Codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # Та же команда, что и на PR: цифры обязаны считаться одинаково.
      - name: Go test (-race)
        working-directory: server
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Отправить покрытие в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: server/coverage.out
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}
          # Строго: молча не отправленный отчёт означает застывший бейдж — ровно
          # ту поломку, ради которой файл и заведён.
          fail_ci_if_error: true

  # Клиент считается на Windows, а ОТПРАВЛЯЕТСЯ с Linux — двумя джобами.
  #
  # CLI Codecov собран PyInstaller-ом и на windows-раннере падает ДО отправки:
  #   UnicodeDecodeError: 'charmap' codec can't decode byte 0x81
  # PYTHONUTF8 не помогает. Пока шаг стоял с fail_ci_if_error: false, падение
  # никто не видел, и флаг launcher не приезжал НИ РАЗУ — при том, что бейдж
  # покрытия в README стоял и читался как «покрытие проекта».
  launcher-build:
    name: Покрытие клиента (сборка отчёта)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Tests (launcher)
        working-directory: launcher/tests/ChillHub.Tests
        run: dotnet test --nologo --collect:"XPlat Code Coverage"

      - name: Найти отчёт
        # coverlet кладёт отчёт в каталог со случайным GUID, а `files:` у
        # codecov-action шаблоны НЕ разворачивает — он ищет путь буквально.
        # Промах при этом молчалив. Поэтому GUID разбирается здесь, где
        # шаблоны работают, и дальше идёт одно фиксированное имя.
        shell: pwsh
        run: |
          $report = Get-ChildItem -Recurse -Filter coverage.cobertura.xml `
            -Path launcher/tests/ChillHub.Tests/TestResults | Select-Object -First 1
          if (-not $report) { throw "coverlet не оставил coverage.cobertura.xml" }
          Copy-Item $report.FullName launcher.cobertura.xml
          Write-Host "отчёт: $($report.FullName)"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-launcher
          path: launcher.cobertura.xml
          retention-days: 1
          if-no-files-found: error

  launcher-upload:
    name: Покрытие клиента в Codecov
    runs-on: ubuntu-latest
    needs: launcher-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-launcher
          path: .

      - name: Убедиться, что отчёт на месте
        # Без этой проверки промах пути проходит молча: при fail_ci_if_error
        # ненайденный файл не считается ошибкой. Пусть падает здесь и по делу.
        run: test -s launcher.cobertura.xml

      - name: Отправить покрытие клиента в Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: launcher.cobertura.xml
          flags: launcher
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  web:
    name: Покрытие браузерного JS в Codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # --all ОБЯЗАТЕЛЕН, и это главное здесь.
      #
      # Без него в отчёт попадают только файлы, которые тесты действительно
      # загрузили, — то есть непокрытый код просто исчезает из знаменателя, и
      # процент растёт от того, что кода стало «меньше». С --all лендинг и
      # морда админки входят в счёт целиком, и цифра наконец отвечает на
      # вопрос «сколько кода проверено», а не «сколько кода мы посчитали».
      - name: Тесты веба с покрытием
        run: >
          npx --yes c8 --all
          --include 'server/admin_ui/**/*.js'
          --include 'landing/**/*.js'
          --reporter=text --reporter=lcov
          node --test tests/web/*.test.js

      - name: Отправить покрытие веба в Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
