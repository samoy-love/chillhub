name: Покрытие main

# ЗАЧЕМ ОТДЕЛЬНЫЙ ВОРКФЛОУ, А НЕ ШАГ В ci.yml.
#
# Codecov привязывает отчёт к КОММИТУ, а бейдж и «project»-статус считает по
# ветке по умолчанию. Отчёты из ci.yml приходят на коммиты веток PR — для main
# они не приезжают никогда, потому что ci.yml намеренно ходит только по
# pull_request (см. комментарий к его триггеру).
#
# Пока этого файла не было, данные main стояли на месте: бейдж в README
# показывал цифру того дня, когда CI последний раз запускался на push в main.
#
# ТРИ СЛАГАЕМЫХ, А НЕ ОДНО. В репозитории три независимых набора кода: сервер
# на Go, клиент на Rust и браузерный JS (лендинг + морда админки). Пока считался
# один сервер, бейдж отвечал не на тот вопрос, который ему задают.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Мержи иногда идут подряд, и вытеснять предыдущий счёт заманчиво: важен
# последний main. Но воркфлоу ходит ТОЛЬКО по push в main, а отменённый прогон
# main — это потерянная цифра коммита, который уже уехал в прод: в Codecov она
# не приедет никогда, и бейдж останется висеть на предыдущем мерже. Здесь то же
# условие по ветке, что в ci.yml, чтобы правило читалось одинаково во всех
# воркфлоу: на ветке вытеснять полезно, на main нельзя.
concurrency:
  group: coverage-main
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  server:
    name: Server coverage (Codecov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # Та же команда, что и на PR: цифры обязаны считаться одинаково.
      - name: Go test (-race)
        working-directory: server
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Отправить покрытие в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: server/coverage.out
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}
          # Строго: молча не отправленный отчёт означает застывший бейдж — ровно
          # ту поломку, ради которой файл и заведён.
          fail_ci_if_error: true

  # Клиент считается на Windows, а ОТПРАВЛЯЕТСЯ с Linux — двумя джобами.
  #
  # CLI Codecov собран PyInstaller-ом и на windows-раннере падает ДО отправки:
  #   UnicodeDecodeError: 'charmap' codec can't decode byte 0x81
  # PYTHONUTF8 не помогает. Пока шаг стоял с fail_ci_if_error: false, падение
  # никто не видел, и флаг launcher не приезжал НИ РАЗУ — при том, что бейдж
  # покрытия в README стоял и читался как «покрытие проекта».
  launcher-build:
    name: Launcher coverage (build report)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-native
        with:
          cache-scope: coverage
      - name: Подготовить инструменты покрытия
        shell: pwsh
        run: ./scripts/ci/ensure-native-quality-tools.ps1 -Component Coverage
      - name: Покрытие Rust-приложений
        shell: pwsh
        run: ./scripts/native-coverage.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-launcher
          path: launcher/ChillHub.Native/dist/coverage
          retention-days: 1
          if-no-files-found: error

  launcher-upload:
    name: Launcher coverage (Codecov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: launcher-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-launcher
          path: .

      - name: Убедиться, что отчёт на месте
        # Без этой проверки промах пути проходит молча: при fail_ci_if_error
        # ненайденный файл не считается ошибкой. Пусть падает здесь и по делу.
        run: test -s launcher.lcov

      - name: Отправить покрытие клиента в Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: launcher.lcov
          flags: launcher
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  web:
    name: Web coverage (Codecov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: npm install
        run: npm ci

      # --all ОБЯЗАТЕЛЕН, и это главное здесь.
      #
      # Без него в отчёт попадают только файлы, которые тесты действительно
      # загрузили, — то есть непокрытый код просто исчезает из знаменателя, и
      # процент растёт от того, что кода стало «меньше». С --all лендинг и
      # морда админки входят в счёт целиком, и цифра наконец отвечает на
      # вопрос «сколько кода проверено», а не «сколько кода мы посчитали».
      - name: Тесты веба с покрытием
        run: >
          npx --yes c8@12.0.0 --all
          --include 'server/admin_ui/**/*.js'
          --include 'landing/**/*.js'
          --reporter=text --reporter=lcov
          node --test tests/web/*.test.js

      - name: Отправить покрытие веба в Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
