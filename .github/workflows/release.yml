name: Release

# Выкатка через общий пайплайн deploy-kit. Пять целей проекта разведены:
# можно выкатить только админку, не трогая публичный API и наоборот.
#
# Старый deploy.yml пока остаётся: он умеет то, чего здесь ещё нет —
# раскладку сайта с сохранением downloads/ и установку пароля админки.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Что катим'
        type: choice
        options: [site, api, admin, servers, all, installer]
        default: all
      dry-run:
        type: boolean
        default: false

jobs:
  site:
    if: inputs.target == 'site' || inputs.target == 'all' || startsWith(github.ref, 'refs/tags/')
    uses: tr0llex/deploy-kit/.github/workflows/static-site.yml@main
    with:
      config: .deploy-kit/site.env
      nginx-conf: deploy/launcher.conf
      # Лендинг — статика без сборки; регресс для него это линтеры разметки.
      gates: npx --yes htmlhint@1.9.2 "landing/**/*.html" && npx --yes stylelint@17.14.1 "landing/**/*.css"
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  api:
    if: inputs.target == 'api' || inputs.target == 'servers' || inputs.target == 'all' || startsWith(github.ref, 'refs/tags/')
    uses: tr0llex/deploy-kit/.github/workflows/go-service.yml@main
    with:
      config: .deploy-kit/api.env
      workdir: server
      gates: go vet ./... && go test ./... -race -coverprofile=coverage.out -covermode=atomic
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  admin:
    if: inputs.target == 'admin' || inputs.target == 'servers' || inputs.target == 'all' || startsWith(github.ref, 'refs/tags/')
    uses: tr0llex/deploy-kit/.github/workflows/go-service.yml@main
    with:
      config: .deploy-kit/admin.env
      workdir: server
      gates: go vet ./... && go test ./... -race -coverprofile=coverage.out -covermode=atomic
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  installer:
    if: inputs.target == 'installer' || startsWith(github.ref, 'refs/tags/')
    uses: tr0llex/deploy-kit/.github/workflows/desktop-artifact.yml@main
    with:
      build: ./scripts/build-installer.ps1 -Configuration Release -AppVersion $env:DEPLOY_VERSION
      artifact: scripts/generated_downloads/ChillHub-Setup.exe
    secrets: inherit
