name: Deploy

# Выкатка через общий пайплайн deploy-kit. Пять целей проекта разведены:
# можно выкатить только админку, не трогая публичный API и наоборот.
#
# Пароль админки живёт хешем в systemd drop-in на сервере и задаётся отдельно
# от выкатки — поэтому шага с bcrypt здесь нет и не должно быть.

# `contents: read` — только checkout. Запись здесь была нужна одному шагу —
# публикации установщика в GitHub Release; канал удалён вовсе (релизы
# хозяйству не нужны, всё раздаёт собственный сервер), и право ушло вместе
# с ним.
#
# `deployments: write` объявляется явно: вызываемый workflow не может
# запросить прав больше, чем есть у вызывающего. Deployment-запись привязана
# к SHA и показывается и на самом коммите, и в панели Environments: это и
# есть видимая связь «коммит → выкатка». Право нужно с ОБЕИХ сторон, и
# половинки могут приехать в разном порядке, поэтому шаг записи в deploy-kit
# обязан пережить 403 и не уронить выкатку: отсутствующая запись — косметика,
# упавший деплой — нет.
permissions:
  contents: read
  deployments: write

# Триггер общий для всех проектов samoy.love: мерж в main уезжает на прод.
# Единственный вход, кроме ручного запуска, — именно он.
#
# ТЕГ БОЛЬШЕ НЕ ТРИГГЕР, но установщик собирается уже не только руками:
# push в main, задевший файлы клиента, пересобирает его и подменяет
# /downloads/ChillHub-Setup.exe на сайте (см. job'у installer).
#
# GitHub Release не публикуется ВООБЩЕ: канал удалён из desktop-artifact —
# релизы хозяйству не нужны, установщик и сборки самообновления раздаёт
# собственный сервер. Понадобится вернуть — начинать с deploy-kit, а здесь
# поднимать contents: write и теговый триггер.
#
# ФИЛЬТР ПУТЕЙ НА ТРИГГЕРЕ — вторая половина того же требования, что решает
# job `changes`. Она отвечает на вопрос «какую цель катим», но ответить «ни
# одну» ей нечем: прогон к этому моменту уже начался. Коммит в README заводил
# прогон, который ничего не выкатывал, — зелёный, пустой и всё равно видимый.
# Теперь коммит, не задевший ни одного файла сервисов, НЕ ЗАПУСКАЕТ ничего.
#
# Список выведен из BUILD_CMD в .deploy-kit/*.env — из того, что реально
# попадает в артефакт, а не из имён каталогов:
#
#   landing/**    site: BUILD_CMD буквально `cp -r landing stage-site`.
#   server/**     api, admin и admin-ui разом. Первые два — `cd server && go
#                 build ./cmd/api|./cmd/admin`, то есть весь модуль server/
#                 целиком: go.mod, go.sum, internal/**. Третья — `cp -r
#                 server/admin_ui`. Каталог указан целиком СОЗНАТЕЛЬНО: точный
#                 разбор, кого из троих задело, делает `changes`, и дублировать
#                 его здесь значило бы завести второй список, который однажды
#                 разойдётся с первым.
#   launcher/ChillHub/**, launcher/*, updater/**, Directory.Build.props,
#   scripts/build-installer.ps1, scripts/installer.nsi, scripts/app.ico,
#   scripts/ci/ensure-nsis.ps1
#                 client: всё, из чего build-installer.ps1 собирает
#                 установщик. Каталог launcher/ разобран на два глоба, а не
#                 взят целиком: build-installer.ps1 собирает ровно
#                 launcher/ChillHub/ChillHub.csproj, а launcher/tests/ в
#                 артефакт не входит и ни одного раздаваемого байта не меняет.
#                 Взятый целиком, он требовал релиза клиента ради обновления
#                 тестового пакета — гейт версии видит правку launcher/ и
#                 требует роста <Version>. `launcher/*` оставляет файлы прямо
#                 в каталоге (сейчас .gitattributes): они общие для обоих
#                 проектов. Апдейтер входит ProjectReference'ом, props —
#                 общие свойства компиляции, четыре файла в scripts/ — сам
#                 сценарий сборки, сценарий NSIS, иконка и установка NSIS
#                 (закреплённая там версия компилятора — тоже вход сборки).
#                 Остальной scripts/** в артефакт не попадает и цель не
#                 задевает.
#   .htmlhintrc*, .stylelint*
#                 гейты обеих статических целей: их правка меняет результат
#                 гейта. Со звёздочкой, потому что в `changes` они проверяются
#                 префиксом, без якоря на конце.
#   .deploy-kit/**, этот файл
#                 катят ВСЁ: описание цели задаёт NEIGHBOURS, KEEP и HEALTH, и
#                 ошибка там видна только на реальной выкатке.
#
# ФИЛЬТР ЗДЕСЬ ОБЯЗАН БЫТЬ НАДМНОЖЕСТВОМ того, что смотрит `changes`. Если он
# отсечёт путь, по которому `changes` выкатил бы цель, эта цель перестанет
# ездить МОЛЧА — прогона нет, значит и красного нет. Поэтому правило простое:
# добавляя путь в `changes`, сначала убедись, что он проходит сюда.
#
# Это правило проверяется машиной, а не только этим комментарием: задача
# `deploy-paths` в ci.yml читает оба списка прямо отсюда, выводит из каждого
# грепа `changes` конкретный путь-образец и валит PR, если образец не проходит
# ни через один глоб ниже. Комментарий остаётся объяснением, но полагаться на
# то, что его прочтут, больше не нужно.
#
# Сверка идёт по каждому грепу из `changes`:
#   ^\.github/workflows/deploy\.yml      → .github/workflows/deploy.yml
#   ^\.deploy-kit/                       → .deploy-kit/**
#   ^landing/                            → landing/**
#   ^\.htmlhintrc                        → .htmlhintrc*
#   ^\.stylelintrc\.json, ^\.stylelintignore → .stylelint*
#   ^server/admin_ui/                    → server/**
#   ^server/(cmd/admin/|internal/|[^/]+$) → server/**
#   ^server/(cmd/api/|[^/]+$)            → server/**
#   ^server/internal/                    → server/**
#   ^(launcher/(ChillHub/|[^/]+$)|updater/|…) → launcher/ChillHub/**,
#                                          launcher/*, updater/**,
#                                          Directory.Build.props и четыре файла
#                                          сборки установщика в scripts/
#
# Обратное направление намеренно неточное: `server/**` шире, чем сумма правил
# `changes` (скажем, будущий server/cmd/tool/ сюда пройдёт, а цели не задел бы).
# Такой промах стоит одного пустого прогона job'ы `changes` — это дёшево, а
# промах в другую сторону стоит невыкаченного прода.
#
# `paths` действует ТОЛЬКО на push. Ручной запуск фильтр не видит вообще:
# workflow_dispatch со всеми целями, включая servers, all и installer, работает
# ровно как работал.
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'server/**'
      - 'launcher/ChillHub/**'
      - 'launcher/*'
      - 'updater/**'
      - 'Directory.Build.props'
      - 'scripts/build-installer.ps1'
      - 'scripts/installer.nsi'
      - 'scripts/app.ico'
      - 'scripts/ci/ensure-nsis.ps1'
      - '.htmlhintrc*'
      - '.stylelint*'
      - '.deploy-kit/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Что катим'
        type: choice
        options: [site, api, admin, admin-ui, servers, all, installer]
        default: all
      dry-run:
        type: boolean
        default: false

# ЦЕЛИ ВЫКАТЫВАЮТСЯ ПО ОЧЕРЕДИ, а не разом.
#
# На хосте один замок (flock в release.sh), и он не ждёт, а падает:
# «очередь на хосте занята нами». Пока цели разводила группа параллелизма в
# deploy-kit, очередь получалась побочным эффектом — ценой того, что лишние
# задачи ОТМЕНЯЛИСЬ и `target=all` не мог выкатить всё. Группу починили, цели
# пошли одновременно и столкнулись на замке: тег v1.2.3 уронил все пять разом.
#
# Порядок здесь явный. `always()` нужен, чтобы отказ одной цели не отменял
# остальные: они независимы, и невыкаченное из-за чужой ошибки — хуже, чем
# частичная выкатка, о которой видно, что она частичная.
#
# Условия целей читаются так: «выбрана явно через workflow_dispatch ИЛИ это
# мерж в main И эту цель задело изменение». Скобки вокруг всего набора после
# `always()` обязательны: `&&` связывает сильнее `||`, и без них `always()`
# относился бы только к первому слагаемому, а остальные проверялись бы сами по
# себе.
#
# Ручной запуск (`workflow_dispatch`) НЕ смотрит на изменения вообще: цель
# выбрал человек, и раз выбрал — катим. Поэтому слагаемые с `inputs.target`
# остались буква в букву прежними, включая `servers` (api+admin) и `all`.
# Дописано только слагаемое про push.
jobs:
  # Что вообще менялось.
  #
  # До этой job'ы любой пуш в main катил ВСЕ ЧЕТЫРЕ цели: в условии каждой
  # стояло голое `github.event_name == 'push'`. Правка одной буквы в лендинге
  # перезапускала API и админку, обнуляя их аптайм, и слала в Telegram четыре
  # сообщения о выкатке вместо одного. Журнал изменений при этом писался всем
  # четырём — то есть врал про три из них.
  #
  # Раскладка путей по целям (выведена из .deploy-kit/*.env и из того, кто что
  # реально импортирует, а не из имён каталогов):
  #
  #   site      — landing/**. BUILD_CMD в site.env буквально `cp -r landing`,
  #               больше в артефакт лендинга не попадает ничего.
  #   admin-ui  — server/admin_ui/**. Тоже голое копирование каталога; бинарь
  #               админки эту статику не встраивает (`go:embed` в server/ нет
  #               ни одного), её раздаёт nginx напрямую.
  #   api/admin — оба собираются из модуля server/ (`workdir: server`), и
  #               именно здесь легко недокатить. Разложено так:
  #                 server/cmd/api/**    → только api
  #                 server/cmd/admin/**  → только admin
  #                 server/<файл в корне модуля> → ОБА (go.mod, go.sum и всё,
  #                   что там однажды заведётся: это общий модуль)
  #                 server/internal/**   → всегда admin, потому что админка
  #                   импортирует ВСЕ семь пакетов internal; api — тоже, кроме
  #                   случая, когда изменения целиком лежат в adminapi/ или
  #                   metrics/: этих двух в cmd/api/main.go нет.
  #   client    — установщик лаунчера на сайте (/downloads/ChillHub-Setup.exe).
  #               Списан с того, что читает build-installer.ps1: launcher/**
  #               (сам клиент), updater/** (входит ProjectReference'ом и
  #               кладётся в установку), Directory.Build.props (общие свойства
  #               компиляции) и четыре файла в scripts/ — build-installer.ps1,
  #               installer.nsi, app.ico, ci/ensure-nsis.ps1 (закреплённая
  #               версия NSIS — тоже вход сборки). scripts/Redist/ в git пуст
  #               (.gitkeep): bootstrapper WebView2 сборка скачивает сама.
  #
  # Правило про internal сознательно вывернуто «от обратного»: считаем пакет
  # общим, пока не доказано, что он админский. Новый пакет, добавленный завтра,
  # по умолчанию попадёт в ОБА сервиса. Лишняя выкатка — это шум; недокат —
  # это прод, молча живущий на старом бинаре, и узнают о нём через неделю.
  #
  # Конфиги линтеров (.htmlhintrc, .stylelintrc.json, .stylelintignore) —
  # это gates целей site и admin-ui, а не украшение: их правка меняет
  # результат гейта, поэтому обе статические цели надо прогнать заново.
  #
  # ВСЁ разом катят только две вещи: сам этот файл и .deploy-kit/**. Описание
  # цели задаёт NEIGHBOURS, KEEP и HEALTH — ошибка там видна лишь на реальной
  # выкатке, и проверить её надо на всех четырёх сразу.
  #
  # НИЧЕГО не катят (просто не попав ни под одно правило, отдельного «списка
  # исключений» нет — он бы рассинхронизировался). Больше того: коммит, целиком
  # состоящий из таких файлов, теперь не заводит и самого прогона — его отсекает
  # `paths` на триггере (см. блок над `on`). Это они: README*.md, docs/**,
  # scripts/** сверх четырёх файлов сборки установщика (dev-скрипты, замеры,
  # сжатие картинок — в артефакты не попадают); content/** и manifests — их
  # редактируют через админку прямо на сервере, выкатка их не трогает (см.
  # комментарий в api.env); tests/**, codecov.yml, .github/workflows/ci.yml
  # и coverage.yml — это CI, а не прод.
  #
  # Отдельно про deploy/**: юниты systemd и backup-content.sh не входят НИ В
  # ОДИН артефакт — все четыре BUILD_CMD либо собирают только бинарь, либо
  # копируют только landing/ и server/admin_ui/. Выкатка по правке юнита не
  # привезла бы на машину ничего, поэтому deploy/** здесь намеренно не катит
  # никакую цель. В status.samoy.love тот же каталог, наоборот, ЕДЕТ: там
  # юниты кладутся в артефакт через BUILD_CMD, и пути deploy/ прописаны в
  # расчёте изменений. Правило оттуда сюда не переносить, не сверившись с
  # BUILD_CMD в .deploy-kit/*.env этого репозитория.
  # Внимание: landing/README.md под «доки» НЕ подпадает — он лежит внутри
  # landing/ и уезжает на прод вместе с ней, поэтому правило `^landing/`
  # намеренно без исключений по расширению.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site: ${{ steps.f.outputs.site }}
      api: ${{ steps.f.outputs.api }}
      admin: ${{ steps.f.outputs.admin }}
      # Ключ через подчёркивание, а не `admin-ui`: в выражениях GitHub дефис
      # в имени свойства читается как минус, и `outputs.admin-ui` не разберётся.
      admin_ui: ${{ steps.f.outputs.admin_ui }}
      client: ${{ steps.f.outputs.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Вся история, а не два коммита: диапазон считается от предыдущей
          # вершины main (github.event.before, см. ниже), и при глубине 2 её
          # объекта в клоне отсутствовали бы — сравнивать было бы не с чем.
          fetch-depth: 0

      - id: f
        env:
          # Предыдущая вершина ветки по данным самого события. Через env, а не
          # подстановкой в тело скрипта: значение приходит извне и в теле
          # команды ему делать нечего.
          BEFORE: ${{ github.event.before }}
        run: |
          all() {
            echo "$1"
            printf 'site=true\napi=true\nadmin=true\nadmin_ui=true\nclient=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }

          # На ручном запуске цель выбирает человек, условия job'ов сюда даже
          # не смотрят. Отвечаем «менялось всё», чтобы значения никогда не были
          # пустыми, если гейтирование однажды перепишут на inputs.
          [ "${{ github.event_name }}" = "push" ] || all 'ручной запуск — цель выбирает человек'

          # ДИАПАЗОН — ОТ ПРЕДЫДУЩЕЙ ВЕРШИНЫ ВЕТКИ, А НЕ ОТ HEAD^.
          #
          # Это тот же диапазон, по которому GitHub считает фильтр `paths` на
          # триггере, и совпадать они обязаны. Сквош-мерж кладёт в main один
          # коммит, и на нём разницы нет. Но пуш из НЕСКОЛЬКИХ коммитов —
          # хотфикс, ревертнутая пачка — при HEAD^ показывает только
          # ПОСЛЕДНИЙ: правка server/cmd/api, приехавшая первым коммитом той
          # же пачки, из отбора исчезала, прогон при этом стартовал (фильтр
          # путей её видел) и заканчивался зелёным, ничего не выкатив. Ровно
          # то тихое недосрабатывание, ради которого весь отбор и заведён.
          #
          # Форс-пуш делает BEFORE недостижимым, а первый пуш ветки — нулями.
          # Оба случая падают обратно на HEAD^: хуже прежнего не станет.
          BASE="$BEFORE"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=HEAD^
          fi

          # ЖИВОЙ ПРОД РАСШИРЯЕТ ДИАПАЗОН, А НЕ ЗАМЕНЯЕТ ЕГО.
          #
          # BEFORE годится только пока прогоны не отменяются очередью. На группу
          # concurrency у GitHub — ровно одна ожидающая задача: катится A, ждёт B,
          # приходит C — B отменяется целиком, C увидит event.before только от
          # своего пуша и про файлы, задетые ТОЛЬКО прогоном B, не узнает никогда.
          # Та же болезнь уже была у списка изменений и лечится тем же приёмом
          # (deploy-kit/.github/workflows/static-site.yml, шаг «Собрать список
          # изменений»): точка отсчёта — коммит, который РЕАЛЬНО стоит на проде, а
          # не то, что было до этого пуша.
          #
          # У `changes` диапазон один на все пять целей, а живой коммит есть не у
          # каждой (WRITE_VERSION_FILE=0 — version.json не раздаётся, это законная
          # норма, а не поломка). Поэтому берём САМЫЙ СТАРЫЙ живой коммит среди
          # целей, у которых VERSION_URL вообще есть: это надмножество диапазона,
          # который нужен любой отдельной цели, а цена ошибки в эту сторону —
          # лишний прогон гейтов, не недокат. Цели без VERSION_URL остаются на
          # диапазоне пуша — не тихо, см. warning ниже.
          LIVE_BASE=""
          for ENV in .deploy-kit/site.env .deploy-kit/api.env .deploy-kit/admin.env .deploy-kit/admin-ui.env; do
            [ -f "$ENV" ] || continue
            VURL=$(sed -n 's/^VERSION_URL=//p' "$ENV" | head -1)
            [ -n "$VURL" ] || continue
            VJ=$(curl -fsS --max-time 10 "$VURL" 2>/dev/null | tr ',' '\n')
            COMMIT=$(printf '%s\n' "$VJ" | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
            if [ -z "$COMMIT" ] || ! git cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
              echo "::warning::$ENV — прод не сказал, что на нём стоит (нет ответа или version.json без commit) — эта цель подстрахована только диапазоном пуша"
              continue
            fi
            if [ -z "$LIVE_BASE" ] || git merge-base --is-ancestor "$COMMIT" "$LIVE_BASE" 2>/dev/null; then
              LIVE_BASE="$COMMIT"
            fi
          done
          if [ -n "$LIVE_BASE" ] && git merge-base --is-ancestor "$LIVE_BASE" "$BASE" 2>/dev/null; then
            echo "живой прод старше диапазона пуша ($LIVE_BASE) — беру его точкой отсчёта"
            BASE="$LIVE_BASE"
          fi

          # Первый коммит в истории (или ветка без родителя после force-push):
          # сравнивать не с чем. Не «ничего не менялось», а «менялось всё» —
          # пустой вывод здесь означал бы тихий пропуск всех четырёх целей.
          git rev-parse -q --verify "$BASE" >/dev/null || all 'не с чем сравнивать — катим всё'

          echo "диапазон: $BASE..HEAD"
          FILES=$(git diff --name-only "$BASE" HEAD)
          echo "изменилось:"; echo "$FILES" | sed 's/^/  /'

          echo "$FILES" | grep -qE '^(\.github/workflows/deploy\.yml|\.deploy-kit/)' \
            && all 'задет сам пайплайн или описание целей — катим всё'

          # Конфиги линтеров — часть гейта обеих статических целей.
          LINT='\.htmlhintrc|\.stylelintrc\.json|\.stylelintignore'

          echo "$FILES" | grep -qE "^(landing/|$LINT)"          && SITE=true  || SITE=false
          echo "$FILES" | grep -qE "^(server/admin_ui/|$LINT)"  && UI=true    || UI=false

          # Админка тянет весь internal, поэтому здесь достаточно одного грепа.
          echo "$FILES" | grep -qE '^server/(cmd/admin/|internal/|[^/]+$)' && ADMIN=true || ADMIN=false

          # API: своя команда и корень модуля — сразу.
          echo "$FILES" | grep -qE '^server/(cmd/api/|[^/]+$)' && API=true || API=false
          # …и любой пакет internal, кроме adminapi/ и metrics/ — их в api нет.
          # `if` вокруг конвейера, а не `&&`: шаг идёт под `bash -e`, и цепочка,
          # закончившаяся ненулевым кодом, уронила бы весь расчёт.
          if [ "$API" = false ] \
             && echo "$FILES" | grep -E '^server/internal/' \
                              | grep -qvE '^server/internal/(adminapi|metrics)/'; then
            API=true
          fi

          # Установщик: всё, из чего build-installer.ps1 собирает артефакт
          # (см. раскладку в комментарии job'ы). Один греп без разбора на
          # части: установщик один, точнее делить нечего. launcher/ разобран
          # на ChillHub/ и файлы прямо в каталоге: launcher/tests/ в артефакт
          # не входит (см. тот же комментарий).
          echo "$FILES" | grep -qE '^(launcher/(ChillHub/|[^/]+$)|updater/|Directory\.Build\.props$|scripts/(build-installer\.ps1|installer\.nsi|app\.ico|ci/ensure-nsis\.ps1)$)' \
            && CLIENT=true || CLIENT=false

          printf 'site=%s\napi=%s\nadmin=%s\nadmin_ui=%s\nclient=%s\n' \
            "$SITE" "$API" "$ADMIN" "$UI" "$CLIENT" | tee -a "$GITHUB_OUTPUT"

  site:
    # `changes` в needs у ВСЕХ четырёх целей, и у site тоже — а раз появился
    # needs, понадобился и `always()`: job с упавшим предком пропускается молча,
    # какое бы условие ни стояло в `if`, если в нём нет статус-функции.
    #
    # `needs.changes.result != 'success'` — страховка, и она есть у всех
    # четырёх. Если расчёт изменений упал (сломался grep, не хватило глубины
    # клона), его outputs пусты, и сравнение с 'true' даст ложь по всем целям:
    # зелёный прогон, из которого не выкатилось НИЧЕГО, — худший исход, потому
    # что о нём никто не узнает. Поэтому упавший `changes` означает «катим всё,
    # как раньше»: сам он при этом горит красным, и потеряться это не может.
    needs: [changes]
    if: >-
      always() && (
        inputs.target == 'site' || inputs.target == 'all'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main'
            && (needs.changes.result != 'success' || needs.changes.outputs.site == 'true'))
      )
    uses: tr0llex/deploy-kit/.github/workflows/static-site.yml@main
    with:
      config: .deploy-kit/site.env
      # Лендинг — статика без сборки; регресс для него это линтеры разметки.
      gates: npx --yes htmlhint@1.9.2 "landing/**/*.html" && npm i -g stylelint@17.14.1 stylelint-config-standard@40.0.0 >/dev/null && npx stylelint "landing/**/*.css"
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  api:
    # site остаётся в needs ради ОЧЕРЕДИ на хосте (см. блок выше) — changes
    # добавлен рядом, а не вместо: порядок site → api → admin → admin-ui
    # сохранён буква в букву.
    needs: [changes, site]
    if: >-
      always() && (
        inputs.target == 'api' || inputs.target == 'servers' || inputs.target == 'all'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main'
            && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true'))
      )
    uses: tr0llex/deploy-kit/.github/workflows/go-service.yml@main
    with:
      config: .deploy-kit/api.env
      workdir: server
      gates: go vet ./... && go test ./... -race -coverprofile=coverage.out -covermode=atomic
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  admin:
    needs: [changes, api]
    if: >-
      always() && (
        inputs.target == 'admin' || inputs.target == 'servers' || inputs.target == 'all'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main'
            && (needs.changes.result != 'success' || needs.changes.outputs.admin == 'true'))
      )
    uses: tr0llex/deploy-kit/.github/workflows/go-service.yml@main
    with:
      config: .deploy-kit/admin.env
      workdir: server
      gates: go vet ./... && go test ./... -race -coverprofile=coverage.out -covermode=atomic
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  admin-ui:
    needs: [changes, admin]
    # `inputs.target == 'admin'` тянет морду за собой — оставлено как было: это
    # удобство ручного запуска, «выкати админку целиком». На push такой связки
    # нет намеренно: морда — статика, которую раздаёт nginx, и правка Go-кода
    # её файлов не меняет. Случай «поменяли и бинарь, и морду» ловится сам —
    # тогда задеты оба набора путей и обе цели поедут.
    if: >-
      always() && (
        inputs.target == 'admin-ui' || inputs.target == 'admin' || inputs.target == 'all'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main'
            && (needs.changes.result != 'success' || needs.changes.outputs.admin_ui == 'true'))
      )
    uses: tr0llex/deploy-kit/.github/workflows/static-site.yml@main
    with:
      config: .deploy-kit/admin-ui.env
      # Морда админки — та же разметка и стили, что и лендинг: гейт тот же.
      gates: npx --yes htmlhint@1.9.2 "server/admin_ui/**/*.html" && npm i -g stylelint@17.14.1 stylelint-config-standard@40.0.0 >/dev/null && npx stylelint "server/admin_ui/**/*.css"
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  installer:
    # ВНЕ ОЧЕРЕДИ site → api → admin → admin-ui, и это единственная цель вне
    # неё. Очередь существует ради замка release.sh на хосте, а установщик
    # release.sh не зовёт: файл кладёт publish-file.sh в /var/www/site-downloads
    # — вне каталогов релизов, без симлинков и юнитов, — замка там нет. Сборка
    # при этом идёт четыре минуты — дольше всей серверной цепочки вместе взятой,
    # и в хвосте очереди она удваивала выкатку: прогон, где серверные цели
    # закончили на второй минуте, тянулся до седьмой.
    #
    # Одно место, где параллельность заметна, — загрузка сборки самообновления
    # в админ-API в конце job'ы: админка в этот момент может переезжать на
    # новый релиз. Это закрыто на стороне desktop-artifact.yml повторами шага с
    # паузой (см. комментарий там), а сервер принимает повторную загрузку той же
    # сборки идемпотентно (launcherRepublishMatches в internal/adminapi/builds).
    # Возвращать admin-ui в needs ради этого — значит платить две минуты
    # каждой выкатки за окно в несколько секунд.
    needs: [changes]
    # Триггера два, публикация одна и та же:
    #
    #   * push в main, задевший файлы клиента (расчёт — job'а `changes`),
    #     пересобирает установщик и подменяет /downloads/ChillHub-Setup.exe
    #     на сайте: кнопка «Скачать» обновляется тем же мержем, что и всё
    #     остальное, а не отстаёт от main на месяцы, как отстала однажды;
    #   * ручной запуск с target=installer — то же самое по требованию,
    #     когда пересборка нужна без изменений клиента.
    #
    # Страховка `needs.changes.result != 'success'` — та же и по той же
    # причине, что у четырёх целей выше: упавший расчёт означает «катим»,
    # а не «молчим». Лишняя пересборка установщика — полчаса раннера и
    # безвредная подмена файла тем же содержимым; тихо не выкаченный
    # установщик — сайт, месяцами раздающий старый билд.
    if: >-
      always() && (
        inputs.target == 'installer'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main'
            && (needs.changes.result != 'success' || needs.changes.outputs.client == 'true'))
      )
    uses: tr0llex/deploy-kit/.github/workflows/desktop-artifact.yml@main
    with:
      # ВСЯ цель — сборка, версия, куда класть и что сверять — описана в
      # .deploy-kit/installer.env, и это описание общее с локальной выкаткой:
      # dk deploy chillhub-installer читает тот же файл и публикует тем же
      # publish-file.sh. Дублировать параметры здесь входами нельзя — два
      # списка одного и того же разъедутся, как разъезжались фильтры путей.
      config: .deploy-kit/installer.env
    secrets: inherit
