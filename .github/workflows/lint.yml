name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  htmlhint-web:
    name: HTMLHint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node20-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node20-
      - name: Install HTMLHint
        run: npm i -g htmlhint
      - name: Run HTMLHint (landing + admin_ui)
        run: |
          npx htmlhint "landing/**/*.html" "server/admin_ui/**/*.html" || (echo "HTMLHint found issues" && exit 1)

  stylelint-web:
    name: Stylelint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node20-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node20-
      - name: Install Stylelint
        run: npm i -g stylelint stylelint-config-standard
      - name: Run Stylelint (landing + admin_ui)
        run: |
          npx stylelint "landing/**/*.css" "server/admin_ui/**/*.css"


  eslint-web:
    name: ESLint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node20-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node20-
      - name: Install ESLint
        run: npm i -g eslint
      - name: Run ESLint (landing + admin_ui)
        run: |
          npx eslint "landing/**/*.js" "server/admin_ui/**/*.js" || (echo "ESLint found issues" && exit 1)

  go-lint:
    name: Go (api + admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            server/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: server

      - name: Go vet
        working-directory: server
        run: go vet ./...

      - name: Go test
        working-directory: server
        run: go test ./...

  nginx-config:
    name: nginx config (real nginx -t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Прогоняем НАСТОЯЩИЙ nginx -t в контейнере. Парсер конфигов принимает то,
      # что nginx отвергает, и наоборот: директивы из отсутствующих модулей,
      # `http2 on;` на nginx < 1.25, особенности регулярок.
      # Версия по умолчанию совпадает с продом (1.24) — иначе проверка была бы
      # ложно-зелёной ровно на том, что там сломается.
      - name: nginx -t (версия прода)
        run: sh deploy/nginx-check.sh
      # Вторым шагом — свежий nginx: заранее увидим, что сломается при апгрейде.
      - name: nginx -t (свежий, некритично)
        continue-on-error: true
        run: NGINX_IMAGE=nginx:alpine sh deploy/nginx-check.sh

  dotnet-lint:
    name: C# (launcher)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
      - name: Restore
        working-directory: launcher/ChillHub
        run: dotnet restore
      - name: Build (Debug)
        working-directory: launcher/ChillHub
        run: dotnet build --no-restore -c Debug
      - name: Build (Release)
        # Release is what ships; building it here catches configuration-specific
        # breakage before a release is cut instead of during a manual build.
        working-directory: launcher/ChillHub
        run: dotnet build --no-restore -c Release
      - name: Tests (launcher)
        # 73 теста, среди них векторы RFC 8032 для самописного Ed25519, которым
        # проверяется подпись манифестов. Без этого шага регрессия в проверке
        # подписи уезжала бы в релиз незамеченной: тесты в репозитории были,
        # но не запускались ни в одном прогоне CI.
        working-directory: launcher/tests/ChillHub.Tests
        run: dotnet test --nologo

      - name: Self-update loop guard (A11)
        # Ловит регрессию «бесконечный цикл самообновления»: файл, попавший
        # ОДНОВРЕМЕННО в манифест лаунчера и под preserve-правила апдейтера,
        # делает расхождение хешей неустранимым — лаунчер обновляется вечно.
        # В репозитории манифестов нет (content/** в .gitignore), поэтому здесь
        # отрабатывает самопроверка детектора: она падает, если сам детектор
        # сломан. Против реальных манифестов запускать так:
        #   ManifestPreserveCheck.exe <путь-к-content/manifests/launcher>
        run: dotnet run --project updater/tests/ManifestPreserveCheck -c Release

      - name: Code style check (dotnet format)
        working-directory: launcher/ChillHub
        # Blocking as of the launcher/** formatting cleanup: the tree is fully
        # formatted and both Debug and Release build warning-free, so anything
        # this step reports now is a real regression and should red-line the PR
        # that introduced it. Reproduce locally by running `dotnet format`
        # (write mode) in this directory and committing the result.
        #
        # Line endings are load-bearing: .editorconfig requires CRLF, so
        # launcher/.gitattributes pins `*.cs`/`*.xaml` to `eol=crlf`. Without
        # that, the checkout would follow the runner's core.autocrlf and this
        # step would report thousands of phantom ENDOFLINE diffs.
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Code style check (dotnet format, tests)
        working-directory: launcher/tests/ChillHub.Tests
        # The test project is not covered by the step above (dotnet format works
        # per project), and it is already clean — keep it that way.
        run: dotnet format --verify-no-changes --verbosity minimal

  installer-windows:
    name: Installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
      - name: Ensure NSIS is available
        shell: pwsh
        # The windows-latest image normally ships NSIS, but do not rely on it:
        # install via Chocolatey only when makensis is missing.
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "makensis found: $((Get-Command makensis).Source)"
          } elseif (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') {
            Write-Host "makensis found in the default install directory"
            Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'
          } else {
            Write-Host "makensis not found, installing NSIS via Chocolatey"
            choco install nsis --no-progress -y
            Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'
          }
      - name: Build installer
        shell: pwsh
        # No secrets required: scripts/installer.nsi does not sign the output and
        # pulls the optional .NET/WebView2 redistributables with `File /nonfatal`,
        # so a runner without scripts/Redist/ still produces a working setup.exe.
        # TODO(owner): add code signing (certificate + password as repository
        # secrets, signtool after makensis) before publishing CI-built setups.
        run: ./scripts/build-installer.ps1 -Configuration Release
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChillHub-Setup-${{ github.run_id }}
          path: scripts/generated_downloads/ChillHub-Setup.exe
          if-no-files-found: error
