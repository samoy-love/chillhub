name: Lint

# ---------------------------------------------------------------------------
# TOOL VERSIONS ARE PINNED ON PURPOSE
# ---------------------------------------------------------------------------
# Every linter below used to float: `npm i -g eslint`, `version: latest`,
# `go-version: stable`. That makes CI non-deterministic in the worst possible
# way — a green PR turns red hours later because an upstream release added a
# rule, and nothing in this repository changed. It also means a build cannot be
# reproduced after the fact.
#
# The versions here were run against this tree before being pinned; all pass.
# Bumping them is a normal, reviewable one-line change — that is the point.
#
#   htmlhint                 1.9.2
#   eslint                   10.8.0
#   stylelint                17.14.1
#   stylelint-config-standard 40.0.0
#   golangci-lint            v2.12.2
#   Go toolchain             taken from server/go.mod (single source of truth)
# ---------------------------------------------------------------------------

# И16: минимальные права для GITHUB_TOKEN.
#
# Блока permissions не было вовсе, поэтому действовали настройки репозитория —
# по умолчанию это read/write на contents, а значит токен, доступный каждому
# шагу (включая `npm i -g` и golangci-lint-action), мог писать в репозиторий.
# Линтеру нужно ровно одно: прочитать код. В deploy.yml такой блок уже есть.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  htmlhint-web:
    name: HTMLHint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node24-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node24-
      - name: Install HTMLHint
        run: npm i -g htmlhint@1.9.2
      - name: Run HTMLHint (landing + admin_ui)
        run: |
          npx htmlhint "landing/**/*.html" "server/admin_ui/**/*.html" || (echo "HTMLHint found issues" && exit 1)

  stylelint-web:
    name: Stylelint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node24-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node24-
      - name: Install Stylelint
        run: npm i -g stylelint@17.14.1 stylelint-config-standard@40.0.0
      - name: Run Stylelint (landing + admin_ui)
        run: |
          npx stylelint "landing/**/*.css" "server/admin_ui/**/*.css"


  eslint-web:
    name: ESLint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node24-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node24-
      - name: Install ESLint
        run: npm i -g eslint@10.8.0
      - name: Run ESLint (landing + admin_ui)
        run: |
          npx eslint "landing/**/*.js" "server/admin_ui/**/*.js" || (echo "ESLint found issues" && exit 1)

  web-tests:
    name: Тесты веба (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Раннер встроен в Node — ни одной внешней зависимости.
      #
      # Здесь проверяются чистые функции админки: экранирование HTML и разбор URL.
      # На них держится защита от XSS, и одна дыра в sanitizeUrl уже находилась
      # ЧТЕНИЕМ кода, а не проверкой: значение вида "java<TAB>script:" не
      # признавалось схемой и проходило как относительная ссылка, тогда как
      # браузер вырезает управляющие символы ДО разбора схемы и выполняет её.
      - name: node --test
        run: node --test tests/web/*.test.js

  go-lint:
    name: Go (api + admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Same toolchain the deploy workflow builds with: read from go.mod,
          # not "stable" (which silently moves with every Go release).
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: server

      - name: Go vet
        working-directory: server
        run: go vet ./...

      - name: Go test
        working-directory: server
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Отправить покрытие в Codecov
        uses: codecov/codecov-action@v5
        with:
          files: server/coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Джоба `nginx config (real nginx -t)` жила здесь до тех пор, пока в этом
  # репозитории лежал свой vhost. Конфиг переехал в deploy-kit (nginx/sites/)
  # вместе со скриптом проверки, а джоба осталась звать `deploy/nginx-check.sh` —
  # файл, которого больше нет, отчего и падала. Настоящий `nginx -t` версии
  # прода теперь гоняет CI самого deploy-kit, там же, где лежит конфиг.

  dotnet-lint:
    name: C# (launcher)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
      - name: Restore
        working-directory: launcher/ChillHub
        run: dotnet restore
      - name: Build (Debug)
        working-directory: launcher/ChillHub
        run: dotnet build --no-restore -c Debug
      - name: Build (Release)
        # Release is what ships; building it here catches configuration-specific
        # breakage before a release is cut instead of during a manual build.
        working-directory: launcher/ChillHub
        run: dotnet build --no-restore -c Release
      - name: Tests (launcher)
        # Тесты плана обновления, разбора манифеста, хешей и структурной проверки
        # путей. Без этого шага регрессия уезжала бы в релиз незамеченной: тесты
        # в репозитории были, но не запускались ни в одном прогоне CI.
        working-directory: launcher/tests/ChillHub.Tests
        run: dotnet test --nologo

      - name: Self-update loop guard (A11)
        # Ловит регрессию «бесконечный цикл самообновления»: файл, попавший
        # ОДНОВРЕМЕННО в манифест лаунчера и под preserve-правила апдейтера,
        # делает расхождение хешей неустранимым — лаунчер обновляется вечно.
        # В репозитории манифестов нет (content/** в .gitignore), поэтому здесь
        # отрабатывает самопроверка детектора: она падает, если сам детектор
        # сломан. Против реальных манифестов запускать так:
        #   ManifestPreserveCheck.exe <путь-к-content/manifests/launcher>
        run: dotnet run --project updater/tests/ManifestPreserveCheck -c Release

      - name: Code style check (dotnet format)
        working-directory: launcher/ChillHub
        # Blocking as of the launcher/** formatting cleanup: the tree is fully
        # formatted and both Debug and Release build warning-free, so anything
        # this step reports now is a real regression and should red-line the PR
        # that introduced it. Reproduce locally by running `dotnet format`
        # (write mode) in this directory and committing the result.
        #
        # Line endings are load-bearing: .editorconfig requires CRLF, so
        # launcher/.gitattributes pins `*.cs`/`*.xaml` to `eol=crlf`. Without
        # that, the checkout would follow the runner's core.autocrlf and this
        # step would report thousands of phantom ENDOFLINE diffs.
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Code style check (dotnet format, tests)
        working-directory: launcher/tests/ChillHub.Tests
        # The test project is not covered by the step above (dotnet format works
        # per project), and it is already clean — keep it that way.
        run: dotnet format --verify-no-changes --verbosity minimal

  installer-windows:
    name: Installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
      - name: Ensure NSIS is available
        shell: pwsh
        env:
          # И31: версия NSIS закреплена явно.
          #
          # Было `choco install nsis` без версии — то есть «что окажется
          # свежим в момент запуска». Установщик собирается компилятором,
          # который может смениться между двумя прогонами одного и того же
          # коммита; это ровно та невоспроизводимость, ради борьбы с которой
          # в шапке этого файла закреплены все остальные линтеры.
          #
          # Если Chocolatey отвергнет эту версию, шаг упадёт с внятной
          # ошибкой — это нормальное, ревьюируемое однострочное обновление.
          # Посмотреть доступные версии: choco list nsis --all-versions
          NSIS_VERSION: '3.11'
        # The windows-latest image normally ships NSIS, but do not rely on it:
        # install via Chocolatey only when makensis is missing.
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "makensis found: $((Get-Command makensis).Source)"
          } elseif (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') {
            Write-Host "makensis found in the default install directory"
            Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'
          } else {
            Write-Host "makensis not found, installing NSIS $env:NSIS_VERSION via Chocolatey"
            choco install nsis --version=$env:NSIS_VERSION --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              throw "choco install nsis --version=$env:NSIS_VERSION failed. Если версия больше не публикуется, обновите NSIS_VERSION в этом шаге (choco list nsis --all-versions)."
            }
            Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'
          }
      - name: Report NSIS version
        shell: pwsh
        # Какой именно компилятор собрал артефакт — это должно быть видно в
        # логе, а не выясняться постфактум.
        run: makensis /VERSION; Write-Host ""
      - name: Build installer
        shell: pwsh
        # No secrets required: scripts/installer.nsi does not sign the output and
        # pulls the optional .NET/WebView2 redistributables with `File /nonfatal`,
        # so a runner without scripts/Redist/ still produces a working setup.exe.
        #
        # -AppVersion обязателен (Б8): installer.nsi больше не имеет молчаливого
        # дефолта версии. Здесь ЗАВЕДОМО нерелизное значение 0.0.0-ci — этот
        # артефакт собирается только чтобы поймать поломку .nsi/сборки, он не
        # подписывается и не публикуется. Если такой билд всё же кто-то поставит,
        # версия 0.0.0-ci не совпадёт ни с одним манифестом и будет видна сразу,
        # вместо того чтобы притвориться настоящим релизом.
        run: ./scripts/build-installer.ps1 -Configuration Release -AppVersion 0.0.0-ci
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChillHub-Setup-${{ github.run_id }}
          path: scripts/generated_downloads/ChillHub-Setup.exe
          if-no-files-found: error
