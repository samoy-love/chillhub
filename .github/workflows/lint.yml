name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  htmlhint-web:
    name: HTMLHint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node20-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node20-
      - name: Install HTMLHint
        run: npm i -g htmlhint
      - name: Run HTMLHint (landing + admin_ui)
        run: |
          npx htmlhint "landing/**/*.html" "server/admin_ui/**/*.html" || (echo "HTMLHint found issues" && exit 1)

  stylelint-web:
    name: Stylelint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node20-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node20-
      - name: Install Stylelint
        run: npm i -g stylelint stylelint-config-standard
      - name: Run Stylelint (landing + admin_ui)
        run: |
          npx stylelint "landing/**/*.css" "server/admin_ui/**/*.css"


  eslint-web:
    name: ESLint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node20-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node20-
      - name: Install ESLint
        run: npm i -g eslint
      - name: Run ESLint (landing + admin_ui)
        run: |
          npx eslint "landing/**/*.js" "server/admin_ui/**/*.js" || (echo "ESLint found issues" && exit 1)

  go-lint:
    name: Go (api + admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            server/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: server

  dotnet-lint:
    name: C# (launcher)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
      - name: Cache .NET tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotnet/tools
          key: dotnet-tools-${{ runner.os }}-v1
      - name: Restore
        working-directory: launcher/ChillHub
        run: dotnet restore
      - name: Build (warnings as errors off for lint stage)
        working-directory: launcher/ChillHub
        run: dotnet build --no-restore -c Debug
      - name: Code style check (dotnet format)
        working-directory: launcher/ChillHub
        # Make non-blocking: report formatting issues without failing the job
        continue-on-error: true
        run: |
          dotnet tool update -g dotnet-format
          dotnet format --verbosity minimal
