name: CI

# ---------------------------------------------------------------------------
# TOOL VERSIONS ARE PINNED ON PURPOSE
# ---------------------------------------------------------------------------
# Every linter below used to float: `npm i -g eslint`, `version: latest`,
# `go-version: stable`. That makes CI non-deterministic in the worst possible
# way — a green PR turns red hours later because an upstream release added a
# rule, and nothing in this repository changed. It also means a build cannot be
# reproduced after the fact.
#
# The versions here were run against this tree before being pinned; all pass.
# Bumping them is a normal, reviewable one-line change — that is the point.
#
#   htmlhint                 1.9.2
#   eslint                   10.8.0
#   @eslint/js               10.0.1
#   stylelint                17.14.1
#   stylelint-config-standard 40.0.0
#   c8                       12.0.0
#   golangci-lint            v2.12.2
#   govulncheck              v1.1.4
#   Go toolchain             taken from server/go.mod (single source of truth)
# ---------------------------------------------------------------------------

# И16: минимальные права для GITHUB_TOKEN.
#
# Блока permissions не было вовсе, поэтому действовали настройки репозитория —
# по умолчанию это read/write на contents, а значит токен, доступный каждому
# шагу (включая `npm i -g` и golangci-lint-action), мог писать в репозиторий.
# Линтеру нужно ровно одно: прочитать код. В deploy.yml такой блок уже есть.
permissions:
  contents: read

on:
  # ТОЛЬКО pull_request. Раньше здесь был ещё push во все ветки, кроме main, и
  # каждый джоб выполнялся ДВАЖДЫ: один раз на пуш ветки, второй — на тот же
  # коммит в PR. Это не удвоенная надёжность, а удвоенное время и деньги: в
  # metro-map сквозные тесты идут минутами, и половина этих минут уходила в
  # прогон, результат которого никто не читает.
  #
  # Гейт — мерж, а мерж идёт через PR, поэтому проверять нужно ровно то, что
  # мержится: pull_request считает проверки на результате слияния с main, а не
  # на голой ветке. Ветка без PR остаётся непроверенной сознательно — её и не
  # во что мержить.
  pull_request:
  # Для ветки без PR: запустить руками, если понадобилось.
  workflow_dispatch:

# Устаревший прогон отменяется, как только пришёл следующий пуш в ту же ветку.
# Без этого пять правок подряд держат пять параллельных прогонов, и первым
# завершается самый старый — то есть зелёная галочка может относиться к коду,
# которого уже нет. Для main отмену НЕ включаем: там каждый коммит должен
# получить свой честный результат, он же попадает в историю.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Соглашение из CLAUDE.md, проверяемое машиной.
  #
  # Записанного правила оказалось мало: трейлер `Co-Authored-By: Claude` уехал
  # в опубликованную историю, и убирать его пришлось переписыванием. Локальный
  # хук (.githooks/commit-msg) ловит это раньше, но он включается вручную и в
  # клоне отсутствует — здесь страховка.
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Версия прибита, как и у остальных инструментов: разбор YAML, уехавший
      # вместе с апстримом, — это красный PR, в котором ничего не меняли.
      - name: Install PyYAML
        run: pip install --quiet pyyaml==6.0.3

      # Сначала гейт проверяет сам себя. Он уже однажды молчал: при запуске без
      # PR диапазон коммитов получался битым, git падал, а `|| true` гасил и
      # это — шаг печатал «чисто» на ветке с трейлером в каждом коммите.
      # Самопроверка исполняет тело шага ниже на заведомо грязных и заведомо
      # чистых входах и требует, чтобы оно на них покраснело и позеленело.
      - name: Самопроверка гейта
        run: python3 scripts/ci/commit-gate-selftest.py

      - name: Проверить сообщения
        env:
          # Оба значения приходят извне и в теле скрипта им делать нечего:
          # заголовок PR пишет автор, а подстановка ${{ }} попала бы в код.
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Один и тот же образец на оба источника. Заголовок PR проверяется
          # наравне с коммитами не для симметрии: сквош-мерж схлопывает ветку в
          # один коммит, темой которого становится ИМЕННО заголовок, и дальше
          # он уезжает в публичные version.json и summary.json (CLAUDE.md).
          # Чистить это пришлось бы переписыванием опубликованной истории.
          PATTERN='^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖'

          # У заголовка образец СВОЙ, и отличается он ровно якорем. В теле
          # коммита трейлер — это отдельная строка, и `^` там бережёт от ложной
          # тревоги на цитату посреди абзаца. Заголовок же всегда ОДНА строка, и
          # дописанный в её конец трейлер под `^` не попадал: «Ускорить сборку
          # Co-Authored-By: Claude <...>» гейт пропускал, а сквош-мерж делал эту
          # строку темой коммита в main и уносил её в публичные version.json и
          # summary.json, откуда убрать её можно только переписыванием истории.
          TITLE_PATTERN='Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖'

          BAD=""

          # base_ref пуст везде, кроме pull_request, — в том числе на ручном
          # workflow_dispatch (см. блок on:). Раньше диапазон в этом случае
          # получался вида "origin/..HEAD", git падал на разборе аргумента, а
          # `|| true` гасил и это падение тоже: шаг печатал «чисто» на ветке, в
          # каждом коммите которой стоял трейлер. Теперь пропуск явный и вслух,
          # как в launcher-version-bump, а `|| true` накрывает только grep —
          # падение git роняет шаг благодаря pipefail.
          if [ -n "$BASE_REF" ]; then
            RANGE="origin/$BASE_REF..HEAD"
            echo "проверяю коммиты $RANGE"
            BAD=$(git log "$RANGE" --format='%H %B' | { grep -iE "$PATTERN" || true; })
          else
            echo "::notice::нет base_ref (не pull_request) — диапазона коммитов нет, сверяю только заголовок"
          fi

          if [ -n "$PR_TITLE" ]; then
            echo "проверяю заголовок PR"
            BAD_TITLE=$(printf '%s\n' "$PR_TITLE" | { grep -iE "$TITLE_PATTERN" || true; })
            if [ -n "$BAD_TITLE" ]; then
              BAD=$(printf '%s\nзаголовок PR: %s' "$BAD" "$BAD_TITLE")
            fi
          fi

          if [ -n "$BAD" ]; then
            echo "::error::есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

  # Два фильтра путей в deploy.yml обязаны оставаться в отношении надмножества.
  #
  # `on.push.paths` решает, заводить ли прогон вообще; job `changes` внутри
  # прогона решает, какие из четырёх целей поедут. Стоит завести в `changes`
  # путь, которого нет в `paths`, и цель по этому пути перестанет выкатываться
  # МОЛЧА: прогон не запустится, значит красного не будет, значит никто не
  # узнает — прод так и останется на старых файлах.
  #
  # Правило записано комментарием над `on` в deploy.yml, но комментарий никого
  # не останавливает: правку в `changes` вносят, не читая его. Здесь то же
  # правило проверяется машиной.
  #
  # Скрипт читает ОБА списка из самого deploy.yml. Третьей копии данных нет
  # намеренно: список, переписанный в проверку, разъехался бы с оригиналом ровно
  # так же, как разъезжаются эти два.
  deploy-paths:
    name: Deploy path filter coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Версия прибита, как и у остальных инструментов выше: разбор YAML,
      # уехавший вместе с апстримом, — это красный PR, в котором ничего не
      # меняли.
      - name: Install PyYAML
        run: pip install --quiet pyyaml==6.0.3
      # Сначала проверка проверяет себя. Скрипт, разучившийся находить грепы в
      # `changes`, выдал бы «расхождений нет» — то есть повторил бы собой ровно
      # тот дефект, который сторожит. Самопроверка прогоняет заведомо
      # расходящиеся пары и требует, чтобы сверка на них покраснела.
      - name: Самопроверка сверки
        run: python3 scripts/ci/deploy-paths-superset.py --self-test
      - name: Сверить on.push.paths с job'ой changes
        run: python3 scripts/ci/deploy-paths-superset.py

  repo-hygiene:
    name: Repo invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Сначала проверка проверяет себя — по той же причине, что и у соседней
      # deploy-paths: скрипт, разучившийся находить нарушение, отвечал бы
      # «инварианты целы» и повторял собой ровно тот дефект, который сторожит.
      - name: Самопроверка инвариантов
        run: python3 scripts/ci/repo-hygiene.py --self-test
      # Без этого шага скрипт гейтом не был: единственным его вызовом был
      # `make lint-repo`, который в CI никто не зовёт, — то есть все шесть
      # правил могли разойтись обратно с зелёным прогоном. Именно так они и
      # разошлись в прошлый раз.
      - name: Инварианты репозитория
        run: python3 scripts/ci/repo-hygiene.py

  htmlhint-web:
    name: HTMLHint (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node24-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node24-
      - name: Install HTMLHint
        run: npm i -g htmlhint@1.9.2
      - name: Run HTMLHint (landing + admin_ui)
        run: |
          npx htmlhint "landing/**/*.html" "server/admin_ui/**/*.html" || (echo "HTMLHint found issues" && exit 1)

  stylelint-web:
    name: Stylelint (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node24-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node24-
      - name: Install Stylelint
        run: npm i -g stylelint@17.14.1 stylelint-config-standard@40.0.0
      - name: Run Stylelint (landing + admin_ui)
        run: |
          npx stylelint "landing/**/*.css" "server/admin_ui/**/*.css"


  eslint-web:
    name: ESLint (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-cache-linters-${{ runner.os }}-node24-v1
          restore-keys: |
            npm-cache-linters-${{ runner.os }}-node24-
      # @eslint/js — базовый набор правил, который подключает eslint.config.js.
      # С десятой версии он не входит в зависимости eslint, а ставить его надо
      # ЛОКАЛЬНО: имя разрешается от каталога конфига, и глобальный префикс npm
      # в этот путь не попадает.
      - name: Install ESLint
        run: |
          npm i -g eslint@10.8.0
          npm i --no-save @eslint/js@10.0.1
      # --max-warnings 0: без него `npx eslint` возвращает 0 на предупреждениях,
      # то есть eqeqeq и no-unused-vars (оба 'warn') гейт не держали вовсе.
      - name: Run ESLint (landing + admin_ui)
        run: |
          npx eslint --max-warnings 0 "landing/**/*.js" "server/admin_ui/**/*.js" || (echo "ESLint found issues" && exit 1)

  web-tests:
    name: Web tests (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Раннер встроен в Node, но admin-dom.test.js гоняет admin.js в настоящем
      # DOM через jsdom (иначе c8 не видит исполнение admin.js вообще — только
      # так и удаётся получить honest coverage для файла, который сам не модуль
      # и ничего не экспортирует). Отсюда одна внешняя зависимость и npm install.
      - name: npm install
        run: npm ci
      #
      # Здесь проверяются чистые функции админки: экранирование HTML и разбор URL.
      # На них держится защита от XSS, и одна дыра в sanitizeUrl уже находилась
      # ЧТЕНИЕМ кода, а не проверкой: значение вида "java<TAB>script:" не
      # признавалось схемой и проходило как относительная ссылка, тогда как
      # браузер вырезает управляющие символы ДО разбора схемы и выполняет её.
      # --all ОБЯЗАТЕЛЕН. Без него в отчёт попадают только файлы, которые
      # тесты действительно загрузили, то есть непокрытый код исчезает из
      # знаменателя и процент растёт от того, что кода стало «меньше».
      - name: node --test с покрытием
        run: >
          npx --yes c8@12.0.0 --all
          --include 'server/admin_ui/**/*.js'
          --include 'landing/**/*.js'
          --reporter=text --reporter=lcov
          node --test tests/web/*.test.js

      - name: Отправить покрытие веба в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  go-lint:
    name: Go (${{ matrix.os }})
    # ДВЕ ПЛАТФОРМЫ, А НЕ ОДНА.
    #
    # Прод — Linux, разработка — Windows, и код между ними расходится молча.
    # За один день это выстрелило дважды: filepath.ToSlash в разборе имён из
    # ZIP и в SanitizeAssetPath заменяет обратные слеши на Windows и НЕ делает
    # ничего на Linux — локально зелено, на сервере другое поведение. А файлы
    # под `//go:build !windows` (freespace_unix.go) на Windows не проверяются
    # ни линтером, ни компилятором вовсе.
    #
    # Прогон на обеих платформах ловит это на пул-реквесте, а не на проде.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Same toolchain the deploy workflow builds with: read from go.mod,
          # not "stable" (which silently moves with every Go release).
          go-version-file: server/go.mod
          # Кэш здесь НЕ через встроенный `cache: true`.
          #
          # На windows-latest этот джоб не только тестирует нативно, но ещё и
          # кросс-компилирует linux/amd64 (шаг ниже). Встроенный кэш setup-go
          # ключуется от runner.os + хэша go.sum и не знает про GOOS/GOARCH —
          # объекты нативной сборки и кросс-компиляции падали в один и тот же
          # GOCACHE и вытесняли друг друга: отсюда разброс 5m21s/1m35s на
          # идентичных шагах между прогонами. Ключ ниже разводит их явно.
          cache: false
      - name: Определить пути кэша Go
        id: go-cache-paths
        shell: bash
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.gocache }}
            ${{ steps.go-cache-paths.outputs.gomodcache }}
          # Отдельное измерение ключа для windows-джобы: она одна собирает под
          # двумя разными GOOS/GOARCH в рамках одного прогона (нативно и
          # linux/amd64), поэтому её кэш держится отдельно от простого
          # ubuntu-native, чтобы не смешивать объекты двух платформ.
          key: go-${{ matrix.os }}-${{ matrix.os == 'windows-latest' && 'native-and-linux-amd64' || 'native' }}-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            go-${{ matrix.os }}-${{ matrix.os == 'windows-latest' && 'native-and-linux-amd64' || 'native' }}-
      - name: Run golangci-lint
        # Приколот к SHA, а не к тегу: тег v8 мутабелен, а этот шаг выполняется
        # рядом с исходниками и кэшем модулей.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: server

      - name: Go vet
        working-directory: server
        run: go vet ./...

      # Кросс-компиляция под прод: ловит то, что не собирается под
      # linux/amd64, даже когда прогон идёт на Windows.
      - name: Go build (linux/amd64, как на проде)
        if: matrix.os == 'windows-latest'
        working-directory: server
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build ./...

      # -race только на Linux: он требует cgo, а на windows-раннере это тянет
      # mingw и заметно замедляет прогон. Гонки платформенно-независимы, так
      # что одного детектора достаточно.
      - name: Go test (-race)
        if: matrix.os == 'ubuntu-latest'
        working-directory: server
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Go test
        if: matrix.os != 'ubuntu-latest'
        working-directory: server
        run: go test ./...

      - name: Отправить покрытие в Codecov
        if: matrix.os == 'ubuntu-latest'
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: server/coverage.out
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Джоба `nginx config (real nginx -t)` жила здесь до тех пор, пока в этом
  # репозитории лежал свой vhost. Конфиг переехал в deploy-kit (nginx/sites/)
  # вместе со скриптом проверки, а джоба осталась звать `deploy/nginx-check.sh` —
  # файл, которого больше нет, отчего и падала. Настоящий `nginx -t` версии
  # прода теперь гоняет CI самого deploy-kit, там же, где лежит конфиг.

  vuln-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      # govulncheck отличается от обычного сканера зависимостей: он сверяет не
      # версии, а ДОСТИЖИМОСТЬ уязвимого кода по графу вызовов. Уязвимость в
      # функции, которую проект не зовёт, не поднимает тревогу — поэтому его
      # находки стоит читать, а не привыкать к ним.
      #
      # Версия приколота, как и всё остальное в этом файле (см. шапку): @latest
      # тянул в джоб с выкачанным репозиторием неприколотый бинарник и делал
      # прогон невоспроизводимым — зелёный PR краснел от чужого релиза. База
      # уязвимостей у govulncheck грузится с сервера и свежа независимо от
      # версии инструмента, так что пин не устаревает по существу. Бампается
      # обычным ревьюабельным однострочником.
      - name: govulncheck (Go)
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      # NuGet-пакеты сверяются со списком известных уязвимостей. Флаг
      # --include-transitive обязателен: прямых зависимостей у лаунчера пять,
      # а тянут они за собой десятки.
      #
      # EnableWindowsTargeting нужен потому, что клиент целится в net8.0-windows
      # (WPF), а раннер здесь линуксовый: без флага восстановление падает с
      # NETSDK1100 ещё до того, как дойдёт до проверки. Собирать проект при этом
      # не требуется — списку пакетов хватает восстановления.
      - name: Уязвимые NuGet-пакеты
        shell: bash
        # Через ПЕРЕМЕННУЮ ОКРУЖЕНИЯ, а не через -p: у `dotnet restore`.
        # MSBuild читает переменные окружения как глобальные свойства, и это
        # единственный способ донести флаг до `dotnet list package` — он
        # переоценивает проект заново и своих -p: не принимает, поэтому флага
        # на restore не хватало.
        env:
          EnableWindowsTargeting: 'true'
        run: |
          set -o pipefail
          for proj in launcher/ChillHub/ChillHub.csproj launcher/tests/ChillHub.Tests/ChillHub.Tests.csproj; do
            echo "== $proj"
            dotnet restore "$proj" >/dev/null
            out=$(dotnet list "$proj" package --vulnerable --include-transitive 2>&1 | tee /dev/stderr)
            if echo "$out" | grep -qiE "has the following vulnerable"; then
              echo "::error::найдены уязвимые NuGet-пакеты в $proj"
              exit 1
            fi
          done

  dotnet-lint:
    name: C# (launcher)
    # Свои ветки собираются на собственном Windows-раннере, форк-PR — на
    # GitHub-hosted. Метка win-builder есть только у нашей машины, поэтому
    # чужой код до неё физически не доедет даже при ошибочном одобрении:
    # для форка выражение вычисляется в windows-latest.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || 'win-builder' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
      - name: Restore
        working-directory: launcher/ChillHub
        run: dotnet restore
      - name: Build (Debug)
        working-directory: launcher/ChillHub
        run: dotnet build --no-restore -c Debug
      - name: Build (Release)
        # Release is what ships; building it here catches configuration-specific
        # breakage before a release is cut instead of during a manual build.
        working-directory: launcher/ChillHub
        run: dotnet build --no-restore -c Release
      - name: Tests (launcher)
        # Тесты плана обновления, разбора манифеста, хешей и структурной проверки
        # путей. Без этого шага регрессия уезжала бы в релиз незамеченной: тесты
        # в репозитории были, но не запускались ни в одном прогоне CI.
        working-directory: launcher/tests/ChillHub.Tests
        # --collect берёт coverlet.collector, который и так лежал в
        # зависимостях тестового проекта, но не использовался: покрытие
        # клиента не считалось вовсе. Бейдж codecov при этом стоял в README и
        # показывал ТОЛЬКО серверную часть на Go — то есть отвечал не на тот
        # вопрос, который читатель ему задаёт.
        run: dotnet test --nologo --collect:"XPlat Code Coverage"

      - name: Найти отчёт о покрытии
        # coverlet кладёт отчёт в каталог со случайным GUID, а `files:` у
        # codecov-action шаблоны НЕ разворачивает. GUID разбирается здесь.
        shell: pwsh
        run: |
          $report = Get-ChildItem -Recurse -Filter coverage.cobertura.xml `
            -Path launcher/tests/ChillHub.Tests/TestResults | Select-Object -First 1
          if (-not $report) { throw "coverlet не оставил coverage.cobertura.xml" }
          Copy-Item $report.FullName launcher.cobertura.xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Отчёт уезжает артефактом, а отправляет его джоба coverage-launcher на
        # ubuntu. CLI Codecov собран PyInstaller-ом и на windows-раннере падает
        # ДО отправки: UnicodeDecodeError на cp1252. PYTHONUTF8 не спасает.
        # Пока шаг стоял здесь с fail_ci_if_error: false, падение не видел
        # никто, и флаг launcher не приезжал ни разу.
        with:
          name: coverage-launcher
          path: launcher.cobertura.xml
          retention-days: 1
          if-no-files-found: error

      - name: Self-update loop guard (A11)
        # Ловит регрессию «бесконечный цикл самообновления»: файл, попавший
        # ОДНОВРЕМЕННО в манифест лаунчера и под preserve-правила апдейтера,
        # делает расхождение хешей неустранимым — лаунчер обновляется вечно.
        # В репозитории манифестов нет (content/** в .gitignore), поэтому здесь
        # отрабатывает самопроверка детектора: она падает, если сам детектор
        # сломан. Против реальных манифестов запускать так:
        #   ManifestPreserveCheck.exe <путь-к-content/manifests/launcher>
        run: dotnet run --project updater/tests/ManifestPreserveCheck -c Release

  # Раньше это были четыре последовательных шага `dotnet format` внутри
  # dotnet-lint: launcher/ChillHub, launcher/tests/ChillHub.Tests, updater,
  # updater/tests/ManifestPreserveCheck. Каждый шаг — самостоятельная проверка
  # своего проекта, ни один не зависит от результата другого и не зависит от
  # build/test выше в dotnet-lint (dotnet format сам restore'ит, что нужно).
  # Четыре independent checks одна за другой — это просто последовательно
  # потраченное время раннера. Матрица гоняет их параллельно, и красный один
  # раз в матрице отмечает конкретный проект, а не общий шаг в длинном логе.
  format:
    name: dotnet format (${{ matrix.project }})
    # Свои ветки собираются на собственном Windows-раннере, форк-PR — на
    # GitHub-hosted. Метка win-builder есть только у нашей машины, поэтому
    # чужой код до неё физически не доедет даже при ошибочном одобрении:
    # для форка выражение вычисляется в windows-latest.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || 'win-builder' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # cache задаётся ПОПРОЕКТНО, а не одним `cache: true` на всю матрицу.
        #
        # У updater и его теста НОЛЬ PackageReference. Восстанавливать им
        # нечего, поэтому C:\Users\runneradmin\.nuget\packages не создаётся
        # никогда — а post-шаг setup-dotnet идёт сохранять кеш этой папки и
        # падает: «Cache folder path is retrieved for .NET CLI but doesn't
        # exist on disk». Проверка при этом зелёная, красный — уже уборка
        # после неё.
        #
        # Почему это вылезало не всегда: ключ кеша считается по
        # cache-dependency-path, то есть по всем *.csproj репозитория. Пока
        # csproj не менялись, кеш попадал, папку создавало восстановление, и
        # post-шаг проходил. Любая правка csproj — прежде всего ПОДЪЁМ ВЕРСИИ
        # ЛАУНЧЕРА — сбрасывает ключ, восстанавливать становится нечего, и обе
        # updater-задачи краснеют. Отсюда закономерность: релизные PR (#90,
        # #93) валились, а те, что csproj не трогали (#91, #92), были зелёными.
        include:
          - project: launcher/ChillHub
            cache: true
          - project: launcher/tests/ChillHub.Tests
            cache: true
          - project: updater
            cache: false
          - project: updater/tests/ManifestPreserveCheck
            cache: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          cache: ${{ matrix.cache }}
          # Путь задаётся только там, где кеш включён: с cache: false он не
          # нужен, а лишний вход у выключенной функции — приглашение к
          # рассинхрону, когда кеш когда-нибудь вернут.
          #
          # packages.lock.json в шаблоне не осталось: в репозитории нет ни
          # одного такого файла, и он лишь размывал ключ.
          cache-dependency-path: ${{ matrix.cache && '**/*.csproj' || '' }}
      - name: Code style check (dotnet format)
        working-directory: ${{ matrix.project }}
        # Blocking as of the launcher/** formatting cleanup: the tree is fully
        # formatted and both Debug and Release build warning-free, so anything
        # this step reports now is a real regression and should red-line the PR
        # that introduced it. Reproduce locally by running `dotnet format`
        # (write mode) in this directory and committing the result.
        #
        # Line endings are load-bearing: .editorconfig requires CRLF, so
        # launcher/.gitattributes and updater/.gitattributes pin `*.cs`/`*.xaml`
        # to `eol=crlf`. Without that, the checkout would follow the runner's
        # core.autocrlf and this step would report thousands of phantom
        # ENDOFLINE diffs.
        run: dotnet format --verify-no-changes --verbosity minimal

  installer-windows:
    name: Installer (NSIS)
    # Свои ветки собираются на собственном Windows-раннере, форк-PR — на
    # GitHub-hosted. Метка win-builder есть только у нашей машины, поэтому
    # чужой код до неё физически не доедет даже при ошибочном одобрении:
    # для форка выражение вычисляется в windows-latest.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || 'win-builder' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
      # Кэш каталога NSIS. Образ windows-latest его не несёт, поэтому
      # ensure-nsis.ps1 каждый прогон тянет дистрибутив заново — минута на то,
      # что от коммита к коммиту не меняется.
      #
      # Скрипту про кэш знать не нужно: у него уже есть ветка «makensis лежит в
      # портативном каталоге» — она добавляет его в PATH и пропускает
      # установку. Восстановленный каталог просто попадает в эту ветку.
      #
      # Путь — .tools/, а не Program Files: NSIS теперь ставится распаковкой
      # архива (см. шапку ensure-nsis.ps1), для которой права администратора
      # не нужны, и локальный прогон кладёт его туда же.
      #
      # Ключ — хэш самого скрипта, а НЕ версия строкой. Версия и контрольная
      # сумма закреплены внутри ensure-nsis.ps1, и продублировать их здесь
      # значило бы завести вторую копию того знания, ради избавления от
      # которого скрипт и появился: подняли бы версию в скрипте, а кэш
      # продолжил бы отдавать старый компилятор. Правка скрипта меняет хэш и
      # сбрасывает кэш сама.
      - name: Cache NSIS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: nsis-${{ runner.os }}-${{ hashFiles('scripts/ci/ensure-nsis.ps1') }}
      # Логика (вместе с закреплённой версией NSIS и отчётом «какой компилятор
      # собрал артефакт») живёт в scripts/ci/ensure-nsis.ps1 и зовётся ещё из
      # входа `build` job'ы installer в deploy.yml. Пока она лежала здесь
      # инлайном, путь выкатки молча полагался на NSIS из образа раннера — а
      # образ его больше не несёт: CI зелёный, публикация упала. Копий больше
      # нет, чтобы зазор между ними не завёлся снова.
      - name: Ensure NSIS is available
        shell: pwsh
        run: ./scripts/ci/ensure-nsis.ps1
      - name: Build installer
        shell: pwsh
        # No secrets required: scripts/installer.nsi does not sign the output and
        # pulls the optional .NET/WebView2 redistributables with `File /nonfatal`,
        # so a runner without scripts/Redist/ still produces a working setup.exe.
        #
        # -AppVersion обязателен (Б8): installer.nsi больше не имеет молчаливого
        # дефолта версии. Здесь ЗАВЕДОМО нерелизное значение 0.0.0-ci — этот
        # артефакт собирается только чтобы поймать поломку .nsi/сборки, он не
        # подписывается и не публикуется. Если такой билд всё же кто-то поставит,
        # версия 0.0.0-ci не совпадёт ни с одним манифестом и будет видна сразу,
        # вместо того чтобы притвориться настоящим релизом.
        #
        # -PackageZip собирает вторым артефактом ЧИСТЫЙ ZIP полезной нагрузки —
        # тот самый, который на выкатке уезжает в админку и становится
        # манифестом. Вместе с ним работает постусловие New-LauncherPayload:
        # «ни одного preserve-файла в архиве». Без ключа эта проверка впервые
        # срабатывала только на публикации, то есть ошибку в списке исключений
        # ловил релиз, а не PR — при том, что цена такой ошибки известна:
        # вечный цикл самообновления у всех, кто поставил сборку (1.0.2, 1.0.3,
        # 1.1.7, 1.1.8).
        run: ./scripts/build-installer.ps1 -Configuration Release -AppVersion 0.0.0-ci -PackageZip
      # Собранный установщик ЗАПУСКАЕТСЯ: ставится тихо во временный каталог,
      # проверяется по составу, версии и реестру, затем так же тихо удаляется.
      # До этого шага единственной проверкой установщика было «makensis не
      # упал», а всё остальное — доезжают ли файлы, совпадает ли
      # launcher.version с версией сборки, исчезает ли запись из списка
      # программ — выяснялось у пользователя. Подробности: scripts/ci/smoke-installer.ps1.
      - name: Smoke-проверка установщика
        shell: pwsh
        run: ./scripts/ci/smoke-installer.ps1 -ExpectedVersion 0.0.0-ci
      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChillHub-Setup-${{ github.run_id }}
          path: scripts/generated_downloads/ChillHub-Setup.exe
          if-no-files-found: error

  coverage-launcher:
    name: Launcher coverage (Codecov)
    runs-on: ubuntu-latest
    needs: dotnet-lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-launcher
          path: .

      - name: Убедиться, что отчёт на месте
        run: test -s launcher.cobertura.xml

      - name: Отправить покрытие клиента в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: launcher.cobertura.xml
          flags: launcher
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Довозили-2026-08-08: 1.3.0..1.3.2 собрались, смержились, но <Version> в
  # ChillHub.csproj остался на 1.3.0 — уже установленным клиентам было нечего
  # предлагать, самообновление молчало у всех троих подряд, а заметили только
  # на четвёртом мерже (#56, "Довезти до пользователей..."). Ничто в CI до
  # этого коммита не спрашивало, выросла ли версия — только человек, руками,
  # после факта.
  #
  # Единственный источник правды — VERSION_CMD в .deploy-kit/installer.env:
  # `<Version>` из ChillHub.csproj и есть версия, которую увидит прод (сверка
  # с ней встроена в build-installer.ps1, Resolve-AppVersion). Проверять
  # что-то ещё значило бы завести второй источник, который может разъехаться
  # с первым.
  launcher-version-bump:
    name: Launcher version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история: сравниваем с базой PR, а не с последним коммитом
          # ветки — правка версии в любом из коммитов PR засчитывается.
          fetch-depth: 0
      - name: Сверить <Version> с тем, что уже на проде
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          if [ -z "$BASE" ]; then
            echo "нет base.sha (не pull_request?) — сверять не с чем, пропускаю"
            exit 0
          fi

          # Триггер — не только launcher/updater. `changes` в deploy.yml
          # пересобирает установщик и по тем же путям, что и здесь, И по двум
          # добавочным: правка .deploy-kit/ или самого deploy.yml валит job'у
          # `changes` в фолбэк «не с чем сравнивать — катим всё» (см. ветку
          # `all` там) и установщик едет заново со старой, уже опубликованной
          # версией — молча, задним числом, уже после мержа. Ровно так провалился
          # прогон https://github.com/samoy-love/chillhub/actions/runs/31264927554:
          # PR трогал только .deploy-kit/*.env, launcher-version-bump это не
          # заметил и пропустил проверку, а installer/build упал на «launcher
          # version 1.3.2 is already published».
          #
          # Список ниже обязан быть НАДМНОЖЕСТВОМ путей из `changes` в
          # deploy.yml — при правке синхронизировать оба места.
          FILES="$(git diff --name-only "$BASE" "$HEAD")"
          #
          # launcher/ разобран на ChillHub/ и файлы прямо в каталоге, а не взят
          # целиком: build-installer.ps1 собирает ровно
          # launcher/ChillHub/ChillHub.csproj, launcher/tests/ в установщик не
          # входит и ни одного раздаваемого байта не меняет. Взятый целиком, он
          # требовал релиза клиента ради обновления тестового пакета.
          if ! echo "$FILES" | grep -qE '^(launcher/(ChillHub/|[^/]+$)|updater/|Directory\.Build\.props$|scripts/(build-installer\.ps1|installer\.nsi|app\.ico|ci/ensure-nsis\.ps1)$|\.github/workflows/deploy\.yml|\.deploy-kit/)'; then
            echo "PR не трогает ни launcher/updater, ни триггеры полной выкатки — версия клиента ни при чём"
            exit 0
          fi

          CSPROJ=launcher/ChillHub/ChillHub.csproj
          DECLARED="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$CSPROJ" | head -1)"
          if [ -z "$DECLARED" ]; then
            echo "::error::в $CSPROJ нет <Version> — версия обязана быть явной (см. CLAUDE.md, раздел «Версии»)"
            exit 1
          fi

          LIVE_JSON="$(curl -fsSL https://launcher.samoy.love/manifests/launcher/latest.json)" \
            || { echo "::error::не удалось прочитать https://launcher.samoy.love/manifests/launcher/latest.json"; exit 1; }
          LIVE="$(printf '%s' "$LIVE_JSON" | sed -n 's#.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*#\1#p')"
          if [ -z "$LIVE" ]; then
            echo "::error::не удалось разобрать версию из latest.json: $LIVE_JSON"
            exit 1
          fi

          echo "На проде сейчас: $LIVE"
          echo "В этом PR:       $DECLARED"

          if [ "$DECLARED" = "$LIVE" ]; then
            echo "::error::<Version> в $CSPROJ ($DECLARED) совпадает с тем, что уже на проде. PR меняет launcher/updater — версия обязана вырасти, иначе самообновление не увидит эту сборку и следующая загрузка того же номера в админку молча заменит уже раздаваемую (см. #56)."
            exit 1
          fi

          HIGHEST="$(printf '%s\n%s\n' "$LIVE" "$DECLARED" | sort -V | tail -1)"
          if [ "$HIGHEST" != "$DECLARED" ]; then
            echo "::error::<Version> в $CSPROJ ($DECLARED) ниже того, что уже на проде ($LIVE). Версия обязана расти, а не откатываться."
            exit 1
          fi

          # СРАВНЕНИЯ С latest.json НЕДОСТАТОЧНО.
          #
          # latest — это то, что лаунчеры сейчас качают, а НЕ то, что уже
          # загружено в админку: выкатка довозит сборку до сервера, а
          # переключение latest делает человек руками, иногда через несколько
          # дней. Между этими двумя моментами версия «занята», но гейт её
          # не видел.
          #
          # Ровно так упала выкатка #108: 1.5.12 приехала с #106 и лежала
          # неактивной, latest оставался 1.5.11, гейт сказал «версия выросла»,
          # а админка на публикации ответила «launcher version 1.5.12 is
          # already published» — уже после мержа, когда установщик на сайте был
          # подменён, а сборка самообновления не уехала. Такой отказ не чинится
          # перезапуском: нужен новый номер и новый мерж.
          #
          # Занятость версии видно по манифесту: сервер кладёт его в
          # content/manifests/launcher/<версия>.json и раздаёт по HTTP.
          MANIFEST_URL="https://launcher.samoy.love/manifests/launcher/$DECLARED.json"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$MANIFEST_URL")"
          case "$CODE" in
            404)
              echo "Версия $DECLARED в админку ещё не загружалась — номер свободен"
              ;;
            200)
              echo "::error::версия $DECLARED УЖЕ опубликована в админке ($MANIFEST_URL), хотя latest пока $LIVE. Повторная загрузка того же номера отклоняется сервером, и выкатка упадёт ПОСЛЕ мержа. Поднимите <Version> в $CSPROJ."
              exit 1
              ;;
            *)
              # Ни 200, ни 404 — сервер не ответил внятно. Молча пропускать
              # нельзя: это тот же «не знаю» который однажды уже выдали за «всё
              # хорошо».
              echo "::error::$MANIFEST_URL ответил $CODE — занятость версии $DECLARED проверить не удалось"
              exit 1
              ;;
          esac

          echo "OK: $DECLARED > $LIVE"

  # Переименование или слияние задачи CI не красит сам прогон в красный —
  # красной становится защита ветки main, и не сразу, а на СЛЕДУЮЩЕМ PR: она
  # хранит старое имя задачи и ждёт его вечно, а кнопка "Merge" просто
  # неактивна без единого объяснения почему. Правится руками в
  # Settings → Branches, но руками же и забывается при очередном
  # переименовании job'ы.
  #
  # GITHUB_TOKEN для чтения защиты ветки не годится: у него нет permission
  # scope "administration" (полный список — actions, artifact-metadata,
  # attestations, checks, contents, deployments, discussions, id-token,
  # issues, models, packages, pages, pull-requests, repository-projects,
  # security-events, statuses). Поэтому нужен secrets.PROTECTION_READ_TOKEN —
  # fine-grained PAT с правами Administration: Read-only (список обязательных
  # проверок) и Actions: Read-only (список задач текущего прогона), заведённый
  # вручную в настройках репозитория. Токен передаётся только этому шагу.
  protection-sync:
    name: Защита ветки соответствует задачам CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # needs — не про очерёдность результата, а про то, что видит Jobs API.
    # GitHub регистрирует задачу с зависимостями в API прогона только когда
    # её needs выполнены и она реально стартовала — без needs эта задача
    # финиширует за секунды и застаёт API в момент, когда половина остальных
    # задач ещё не создана, а не пропущена. Итог — те же ложные "пропала
    # проверка", от которых задача должна защищать.
    needs:
      - commits
      - deploy-paths
      - htmlhint-web
      - stylelint-web
      - eslint-web
      - web-tests
      - go-lint
      - vuln-scan
      - dotnet-lint
      - format
      - installer-windows
      - coverage-launcher
      - launcher-version-bump
    if: always()
    env:
      GH_TOKEN: ${{ secrets.PROTECTION_READ_TOKEN }}
    steps:
      # Секреты репозитория не отдаются прогонам dependabot и форков — там
      # PAT приходит пустым. Сверять нечего: задача проверяет настройку
      # репозитория, а не содержимое PR, и на своих ветках отработает та же
      # проверка. Падать здесь — значит красить чужие PR за то, чего они не
      # ломали, поэтому пропускаем явно и вслух.
      - name: Пропустить сверку без доступа к защите ветки
        if: env.GH_TOKEN == ''
        run: |
          echo "::notice::PAT недоступен (dependabot или форк) — сверка защиты ветки пропущена"

      # SHA, а не тег: тег мутабелен, а на уровне job'ы здесь лежит PAT с
      # правами на чтение защиты ветки — переставленный владельцем тег унёс бы
      # его на ближайшем же прогоне.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.GH_TOKEN != ''

      - name: Сверить задачи с обязательными проверками main
        if: env.GH_TOKEN != ''
        env:
          SELF_JOB_NAME: Защита ветки соответствует задачам CI
        run: bash ci/branch-protection-check.sh
