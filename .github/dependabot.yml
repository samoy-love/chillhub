version: 2

# Обновления зависимостей раз в неделю, по понедельникам: реже — и копится
# пачка, которую разбирают залпом и потому невнимательно; чаще — и PR
# перестают читать вовсе.
#
# open-pull-requests-limit держит очередь короткой намеренно. Двадцать
# открытых PR от бота — это не двадцать обновлений, а ноль.
#
# Сообщения на русском в повелительном наклонении, как везде в этих
# репозиториях (CLAUDE.md). Префикс deps: отделяет машинные правки от
# человеческих.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "nuget"
    directory: "/launcher/ChillHub"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # BLAKE3 ОСТАЁТСЯ НА МАЖОРЕ 2. ЭТО РЕШЕНИЕ, А НЕ ЗАБЫТОЕ ОБНОВЛЕНИЕ.
      #
      # Значения хешей — контракт между сервером и КАЖДЫМ установленным
      # лаунчером: манифест опубликованной версии хранит их навсегда, а клиент
      # пересчитывает файлы на диске и сравнивает. Разъехавшиеся реализации не
      # дают никакой ошибки — каждый установленный лаунчер просто решает, что
      # не совпадает ни один файл, и перекачивает игры целиком.
      #
      # Эталонные векторы в тестах (HashVectorTests.cs и
      # server/internal/adminapi/builds/hashvector_test.go) расхождение ловят,
      # но риск здесь несимметричный: цена ошибки — не красный прогон, а
      # гигабайты трафика у пользователей, замеченные ими, а не нами. Выгода
      # же от мажорного обновления хеш-библиотеки близка к нулю: BLAKE3 —
      # замороженная спецификация, считать «лучше» тут нечего.
      #
      # Снимать это правило — только вместе с планом, что делать с уже
      # опубликованными манифестами.
      - dependency-name: "Blake3"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "nuget"
    directory: "/launcher/tests/ChillHub.Tests"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "nuget"
    directory: "/updater"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
