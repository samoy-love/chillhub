[package]
name = "chillhub-native"
version = "1.8.1"
edition = "2024"
rust-version = "1.92"
publish = false

[[bin]]
name = "ChillHub"
path = "src/main.rs"
required-features = ["launcher-ui"]
[[bin]]
name = "ChillHub-Updater"
path = "src/bin/updater.rs"
required-features = ["helper-ui"]
[[bin]]
name = "ChillHub-SecurityHelper"
path = "src/bin/security_helper.rs"
required-features = ["helper-ui"]

[[test]]
name = "ui_render"
path = "tests/ui_render.rs"
required-features = ["launcher-ui"]

[features]
default = ["launcher-ui"]
launcher-ui = ["dep:slint", "dep:image", "dep:raw-window-handle", "slint/renderer-femtovg-wgpu", "slint/raw-window-handle-06", "slint/unstable-winit-030", "web-video"]
helper-ui = ["dep:slint"]
benchmark = ["launcher-ui", "slint/renderer-femtovg", "slint/unstable-wgpu-30"]
web-video = ["dep:webview2-com", "dep:windows"]

[dependencies]
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "ico"] }
raw-window-handle = { version = "0.6", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
blake3 = "1"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
winreg = "0.55"
webview2-com = { version = "=0.39.1", optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "=0.1.34"

[profile.release]
opt-level = 3
strip = "symbols"
lto = "thin"
codegen-units = 1
# Worker recovery in the controller and helpers relies on unwinding.
panic = "unwind"
