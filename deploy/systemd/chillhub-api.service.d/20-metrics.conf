# Адрес экспортёра Prometheus публичного API.
#
# По умолчанию promexp слушает loopback (см. docs/configuration.md). Prometheus
# живёт контейнером в стеке samoylove-metrics и из своего сетевого namespace до
# 127.0.0.1 хоста не достаёт: цель chillhub-api месяцами висела в down с
# «connection refused», при том что экспортёр в процессе исправно работал.
#
# 172.17.0.1 — адрес docker0, он же host.docker.internal для контейнеров.
# Слушатель поднимается ровно на этом интерфейсе: наружу, по публичному адресу
# сервера, порт не отвечает вообще — не потому, что его закрыл firewall, а
# потому, что там нет сокета.
#
# Значение продублировано в prometheus/prometheus.yml репозитория
# metrics.samoy.love (цель chillhub-api): порт стоит менять сразу в обоих
# местах, иначе цель тихо ляжет.
#
# Файл — часть репозитория, а не ручная правка на сервере: drop-in, который
# существует только в /etc/systemd/system, теряется при первой же
# переустановке юнита, и метрики пропадают без единого следа в истории.
[Service]
Environment=API_METRICS_LISTEN_ADDR=172.17.0.1:55701
