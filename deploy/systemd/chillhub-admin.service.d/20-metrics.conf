# Адрес экспортёра Prometheus админки — по тем же причинам, что и у
# chillhub-api (см. deploy/systemd/chillhub-api.service.d/20-metrics.conf).
#
# Порт отдельный: у админки свой реестр, и продуктовые числа админки
# (публикации версий, техработы, обратная связь) не должны смешиваться с
# числами публичного API в одной цели Prometheus.
[Service]
Environment=ADMIN_METRICS_LISTEN_ADDR=172.17.0.1:55778
