# Nginx configuration for samoy.love and launcher.samoy.love

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name launcher.samoy.love;
    return 301 https://$host$request_uri;
}

#
# Main site: launcher.samoy.love
server {
    listen 443 ssl http2;
    server_name launcher.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/launcher.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/launcher.samoy.love/privkey.pem;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Landing site static (from repository /landing)
    root /var/www/site;
    index index.html;

    # Unified /assets with fallback to news assets using internal prefix + root
    # 1) Try landing: /var/www/site/assets/<tail>
    # 2) Fallback (internal): /var/www/launcher/news/assets/<tail>
    location ~ ^/assets/(.*)$ {
        set $asset_tail $1;
        root /var/www/site;
        try_files /assets/$asset_tail @news_assets_fallback;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location @news_assets_fallback {
        internal;
        # Re-map to news assets root, stripping '/assets/' prefix
        root /var/www/launcher/news/assets;
        # After root above, '/<tail>' resolves to /var/www/launcher/news/assets/<tail>
        try_files /$asset_tail =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Public API (Go, :55700)
    location /api/ {
        proxy_pass http://127.0.0.1:55700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        access_log /var/log/nginx/launcher_api_access.log;
        error_log  /var/log/nginx/launcher_api_error.log;
    }

    # Internal auth gate for admin (uses backend verify endpoint)
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:55777/admin/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Admin API (Go, :55777)
    # Allow auth endpoints without auth_request
    location ^~ /admin/api/auth/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://127.0.0.1:55777;
    }

    # Protected admin API
    location /admin/api/ {
        client_max_body_size 5g;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        auth_request /_auth;

        proxy_pass http://127.0.0.1:55777;
    }

    # Admin UI (static). Serve via nginx from /var/www/launcher/admin_ui
    location ^~ /admin/ui/ {
        alias /var/www/launcher/admin_ui/;
        add_header Cache-Control "no-store";
    }
    location = /admin {
        return 302 /admin/;
    }
    # Serve only the root /admin/ (admin.html) via try_files rooted at admin_ui
    # This works well for both GET and HEAD and avoids proxying
    # Protect admin UI entrypoint with auth_request; login page is under /admin/ui/login.html (not protected)
    location = /admin/ {
        auth_request /_auth;
        root /var/www/launcher/admin_ui;
        try_files /admin.html =404;
        add_header Cache-Control "no-store";
    }

    # Landing root and HTML/CSS/JS should never be cached by browsers
    location = / {
        root /var/www/site;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location = /index.html {
        root /var/www/site;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location ~* ^/.+\.(?:html|css|js|map)$ {
        root /var/www/site;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    # No generic /admin/ proxy; API is under /admin/api/ only

    # Content storage (large files)
    location /content/ {
        alias /var/www/launcher/content/;
        add_header Cache-Control "no-cache";
        sendfile on;
        tcp_nopush on;
        directio 8m;
        open_file_cache max=10000 inactive=30s;
        access_log /var/log/nginx/launcher_content_access.log;
        error_log  /var/log/nginx/launcher_content_error.log;
    }

    # Manifests (JSON)
    location /manifests/ {
        alias /var/www/launcher/manifests/;
        add_header Cache-Control "no-cache";
    }

    # News (markdown, json)
    location /news/ {
        alias /var/www/launcher/news/;
        add_header Cache-Control "no-cache";
    }

    # (Optional) explicit news assets path still works via fallback; dedicated block not required
}
