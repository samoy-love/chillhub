# Nginx configuration for samoy.love and launcher.samoy.love

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name samoy.love launcher.samoy.love;
    return 301 https://$host$request_uri;
}

# Deny all other hosts
server {
    listen 443 ssl http2 default_server;
    server_name _;
    return 444;
}

# Placeholder for samoy.love (simple static page)
server {
    listen 443 ssl http2;
    server_name samoy.love;

    ssl_certificate     /etc/letsencrypt/live/samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samoy.love/privkey.pem;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Serve a simple placeholder page
    root /var/www/placeholder;
    index index.html;
    location = / { try_files /index.html =404; }
}

# Main site: launcher.samoy.love
server {
    listen 443 ssl http2;
    server_name launcher.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/launcher.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/launcher.samoy.love/privkey.pem;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Landing site static (from repository /landing)
    root /var/www/site;
    index index.html;

    # Shared /assets: prefer landing assets, fallback to news assets
    location /assets/ {
        root /var/www/site;                 # serves /var/www/site/assets/... when present
        try_files $uri @news_assets;        # fallback to news assets if not found in landing
        add_header Cache-Control "no-store";
    }
    location @news_assets {
        internal;
        alias /var/www/launcher/news/assets/;
        add_header Cache-Control "no-cache";
    }

    # Public API (Go, :55700)
    location /api/ {
        proxy_pass http://127.0.0.1:55700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        access_log /var/log/nginx/launcher_api_access.log;
        error_log  /var/log/nginx/launcher_api_error.log;
    }

    # Admin API (Go, :55777) exposed as /admin/api/* and mapped to backend /admin/*
    location /admin/api/ {
        client_max_body_size 5g;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_pass http://127.0.0.1:55777/admin/;
    }

    # Admin UI (static). Serve via nginx from /var/www/launcher/admin_ui
    location ^~ /admin/ui/ {
        alias /var/www/launcher/admin_ui/;
        add_header Cache-Control "no-store";
    }
    location = /admin {
        return 302 /admin/;
    }
    # Serve only the root /admin/ (admin.html) statically
    location = /admin/ {
        index admin.html;
        alias /var/www/launcher/admin_ui/;
        add_header Cache-Control "no-store";
    }
    # Proxy all other /admin/* endpoints to backend (for legacy UI calls like /admin/list, /admin/news/*)
    location /admin/ {
        proxy_pass http://127.0.0.1:55777/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Content storage (large files)
    location /content/ {
        alias /var/www/launcher/content/;
        add_header Cache-Control "no-cache";
        sendfile on;
        tcp_nopush on;
        aio on;
        directio 8m;
        open_file_cache max=10000 inactive=30s;
        access_log /var/log/nginx/launcher_content_access.log;
        error_log  /var/log/nginx/launcher_content_error.log;
    }

    # Manifests (JSON)
    location /manifests/ {
        alias /var/www/launcher/manifests/;
        add_header Cache-Control "no-cache";
    }

    # News (markdown, json)
    location /news/ {
        alias /var/www/launcher/news/;
        add_header Cache-Control "no-cache";
    }

    # (Optional) explicit news assets path still works via fallback; dedicated block not required
}
