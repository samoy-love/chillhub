# Nginx configuration for samoy.love and launcher.samoy.love
#
# ---------------------------------------------------------------------------
# SECURITY HEADERS — why they are repeated in every location block
# ---------------------------------------------------------------------------
# nginx's add_header directives are inherited from the previous configuration
# level ONLY IF the current level defines no add_header of its own. Almost every
# location below sets its own `add_header Cache-Control ...`, which silently
# dropped the server-level security headers — they were effectively applied
# nowhere except the few locations without any add_header.
#
# Two fixes are possible:
#   a) put the headers in an include-snippet and `include` it in every location;
#   b) repeat them explicitly in every location that has its own add_header.
#
# We chose (b) on purpose: this file is deployed standalone (deploy.yml copies
# exactly one file to /etc/nginx/sites-available/launcher.conf), so an external
# snippet would add a second deployment artifact whose absence would break
# `nginx -t` and therefore the whole reload. Explicit duplication keeps the
# config self-contained and greppable at the cost of verbosity.
#
# `always` is added everywhere so the headers are also emitted on error
# responses (401/403/404/5xx), not just on 2xx/3xx.
#
# The canonical base set (keep these five in sync across all blocks):
#     add_header X-Content-Type-Options nosniff always;
#     add_header X-Frame-Options DENY always;
#     add_header X-XSS-Protection "1; mode=block" always;
#     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#     add_header Strict-Transport-Security "max-age=300" always;
#
# X-XSS-Protection is legacy (ignored by modern browsers) but kept with its
# original value so behaviour is not silently changed.
#
# ---------------------------------------------------------------------------
# HSTS — DELIBERATELY SHORT max-age FOR NOW (5 minutes)
# ---------------------------------------------------------------------------
# HSTS is a one-way door: once a browser has seen the header it will REFUSE to
# talk to launcher.samoy.love over plain HTTP, and it will refuse to let the
# user click through a certificate error, for the whole max-age window. There
# is no way to shorten that window for a browser that has already cached it
# except to serve a smaller max-age and wait for that client to come back.
#
# So if the Let's Encrypt certificate ever expires without being renewed, a
# max-age=31536000 (one year) header turns "the site is down until I fix the
# cert" into "the site is unreachable for every returning visitor for up to a
# year, with no override button". Automatic renewal has NOT been confirmed on
# this host yet, so we start at max-age=300 (5 minutes) — enough to be a real
# HSTS deployment, short enough that a mistake self-heals almost immediately.
# `includeSubDomains` is also omitted for now: it would extend the same one-way
# rule to every current and future *.samoy.love host, including ones this
# config knows nothing about.
#
# HOW TO CONFIRM AUTOMATIC RENEWAL WORKS (do all four on the server):
#   1. The timer exists and is active:
#        systemctl list-timers 'certbot*' --all
#        systemctl status certbot.timer
#      Expect an active timer with a NEXT run in the future. (On some installs
#      the job lives in /etc/cron.d/certbot instead — that is fine too.)
#   2. A renewal actually succeeds end to end, without touching the real cert:
#        sudo certbot renew --dry-run
#      Expect "Congratulations, all simulated renewals succeeded".
#   3. The deploy hook really reloads nginx, otherwise nginx keeps serving the
#      old certificate from memory after a successful renewal:
#        grep -r renew_hook /etc/letsencrypt/renewal/launcher.samoy.love.conf
#      It should run something like `systemctl reload nginx`.
#   4. Watch one real renewal happen. Certbot renews at ~30 days remaining, so
#      check the expiry date and come back after it has rolled over:
#        openssl s_client -connect launcher.samoy.love:443 -servername \
#          launcher.samoy.love </dev/null 2>/dev/null \
#          | openssl x509 -noout -dates
#
# HOW TO RAMP UP AFTERWARDS (edit every Strict-Transport-Security line in this
# file — they are intentionally duplicated per location, so change them all;
# `grep -c Strict-Transport-Security deploy/launcher.conf` tells you how many
# there should be). Wait at least the previous max-age between steps, and check
# the header with `curl -sI https://launcher.samoy.love | grep -i strict`:
#   step 1  max-age=300                              <- WE ARE HERE
#   step 2  max-age=86400                            (1 day, after step 2 above)
#   step 3  max-age=604800                           (1 week, after one real
#                                                     automatic renewal)
#   step 4  max-age=2592000                          (30 days)
#   step 5  max-age=31536000                         (1 year)
#   step 6  max-age=31536000; includeSubDomains      only once you are sure
#           EVERY *.samoy.love host has a valid certificate and always will
#   step 7  ...; includeSubDomains; preload          only if you actually want
#           to submit to hstspreload.org — removal from the preload list takes
#           months and is effectively irreversible. Not recommended here.
#
# Do NOT jump straight back to a year "because it worked for a week". The whole
# point of the ladder is that each step limits the blast radius of the next.
#
# ---------------------------------------------------------------------------
# CONTENT SECURITY POLICY
# ---------------------------------------------------------------------------
# CSP is only attached to HTML-serving locations (there is no point in sending
# it with images or JSON API responses).
#
# Landing (/, /index.html, *.html under /var/www/site) — ENFORCED.
#   Audited against landing/index.html + landing/scripts/main.js:
#     - inline <style> block with critical CSS      -> style-src 'unsafe-inline'
#     - Google Fonts CSS / font files               -> fonts.googleapis.com, fonts.gstatic.com
#     - <img> fallbacks to placehold.co             -> img-src https://placehold.co
#     - canvas 2d animation, no fetch/XHR/iframes   -> connect-src 'self', frame-ancestors 'none'
#
#   script-src is 'self' ONLY — no 'unsafe-inline'. The five inline
#   onerror="…" attributes that used to require it were replaced by a
#   declarative data-fallback="…" attribute plus a setupImageFallbacks()
#   binder in landing/scripts/main.js. index.html now contains exactly one
#   <script>, and it has a src=; there are no inline handlers, no eval, no
#   javascript: URLs and no fetch/XHR anywhere on the landing page.
#
#   style-src KEEPS 'unsafe-inline' and that is expected: index.html carries a
#   real inline <style> block of critical CSS. Removing it is a separate,
#   larger change and is not required for the script-src hardening above.
#
#   NOTE(owner): if you add an inline onclick=/onerror= to index.html again,
#   it will now silently do nothing (the browser blocks it and logs a CSP
#   violation). Bind handlers in scripts/main.js instead.
#
# Admin UI (/admin/, /admin/ui/*.html) — ENFORCED.
#   Derived from a full static audit of server/admin_ui/{admin,login}.html,
#   admin.js (~158 KB), login.js and admin.css. Findings, directive by directive:
#
#   script-src 'self' https://cdn.jsdelivr.net https://unpkg.com
#       Exactly five <script> tags exist across both HTML files and every one of
#       them has a src=: bootstrap@5.3.3 bundle (jsdelivr), uplot@1.6.30 iife
#       (unpkg), /admin/ui/admin.js, /admin/ui/login.js. There is NOT a single
#       inline <script> block, so no 'unsafe-inline' and no hashes are needed.
#       There are also NO inline event-handler attributes (onclick=/onerror=/…)
#       anywhere in the admin UI — every handler is bound with addEventListener.
#       (The one `onChange` hit in admin.js is a local variable name, not an
#       attribute.) No eval(), no new Function(), no setTimeout("string"),
#       no import(), no javascript: URLs, no document.write, no dynamically
#       created <script> elements — hence no 'unsafe-eval'. Bootstrap 5 and
#       uPlot do not need 'unsafe-eval' either.
#
#   style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com
#       'unsafe-inline' is genuinely required: admin.js builds markup through
#       .innerHTML (69 sites) containing many style="…" attributes, e.g.
#       `<select … style="max-width:200px">` in the paste-upload modal, and
#       admin.html has inline style= attributes too. The two CDNs serve
#       bootstrap.min.css and uPlot.min.css. There are no <style> blocks and no
#       @import in admin.css.
#
#   img-src 'self' data: blob: https:
#       blob: — URL.createObjectURL() previews for a picked/pasted image
#       (admin.js openPasteUploadDialog and the icon picker) are assigned to
#       img.src. https: (any host) — news covers come from
#       extractCoverFromMarkdown(): operator-authored markdown may reference an
#       image on any external host and the editor renders that preview
#       (admin.js:2258 `img.src = it.coverUrl`). data: — base64 images embedded
#       in the same operator-authored markdown. Images are an inert sink, so a
#       wide img-src is a deliberate, low-risk trade for a working editor.
#
#   connect-src 'self'
#       Every fetch()/XMLHttpRequest target is a same-origin relative path
#       (verified: no fetch("http…"), no protocol-relative URLs, the single XHR
#       is xhr.open('POST','/admin/uploadStream')). No WebSocket, no
#       EventSource, no sendBeacon.
#
#   font-src 'self'
#       admin.css contains no url()/@font-face; Bootstrap 5.3 ships a
#       system-font stack and no font files; uPlot ships none. Nothing should
#       ever request a font here. Worst case if this is wrong: a fallback font,
#       not a broken panel.
#
#   frame-src / child-src / worker-src 'none'
#       No <iframe>, no srcdoc, no <embed>/<object>, no Worker/SharedWorker and
#       no serviceWorker registration exist in the admin UI.
#
#   form-action 'self'
#       The only <form> is #loginForm in login.html; it has no action= and is
#       submitted from login.js via fetch to a same-origin path.
#
#   NOTE(owner): if you ever add an inline <script>, an onclick= attribute or a
#   third-party host to the admin UI, this header must be updated in the same
#   commit or the panel will break. If something does break, the browser console
#   names the exact directive; temporarily rename the header back to
#   Content-Security-Policy-Report-Only to unblock yourself.
#
# ---------------------------------------------------------------------------
# COMPRESSION — ON FOR TEXT, EXPLICITLY OFF FOR /content/
# ---------------------------------------------------------------------------
# gzip is enabled at the server level (so it is inherited by every location)
# and then explicitly DISABLED inside `location ^~ /content/`. Rationale, with
# numbers measured on this repository's own data — see deploy/README.md,
# section "Сжатие при раздаче (gzip)", for the full table:
#
#   * /manifests/*.json is the win. A real build manifest
#     (content/manifests/drive-beyond-horizons/1.0.2.json, 2809 file entries)
#     is 905 549 B raw and 272 404 B at gzip level 5 — 3.32x, i.e. ~618 KiB
#     saved on EVERY update check, per game, per client. The payload is a list
#     of {path, size, blake3, sha256} records: hex hashes and repeated path
#     prefixes are about as compressible as text gets.
#
#   * /content/ is not. 74% of the bytes of that same build are Unity
#     .lethalbundle/.assetbundle archives (already LZ4/LZMA-compressed
#     internally), plus .ress/.ogg/.mp4/.png — all pre-compressed formats where
#     gzip returns ~0% and costs real CPU on multi-GiB transfers. Worse, gzip
#     is not merely useless there, it is actively harmful:
#       - it disables sendfile()/directio (nginx has to copy through userspace),
#       - and it kills byte-range resume. The launcher resumes interrupted
#         downloads with a Range header (SimpleSyncService.cs sets
#         req.Headers.Range for partially downloaded files); nginx cannot serve
#         a range out of an on-the-fly gzip stream, so every resume would turn
#         into a full re-download of a multi-GiB file.
#     Hence `gzip off;` in that location — treat it as load-bearing, not tidy-up.
#
#   * /api/* and /news/* are JSON too and ride along for free via inheritance.
#     Compression for them is done HERE, in nginx, and deliberately NOT in the
#     Go backends: Go would have to compress on every request with no shared
#     config, no `Vary` bookkeeping and no way to be bypassed for /content/,
#     while nginx already terminates TLS and knows the MIME type.
#
# gzip_comp_level 5 is the knee of the curve for this data: level 1 gives
# 290 999 B, level 5 gives 272 404 B (-6.4%), level 9 only 268 824 B (a further
# -1.3% for ~35% more CPU). gzip_min_length 1024 keeps tiny replies
# (_registry/games.json is 542 B) uncompressed — below ~1 KB the framing
# overhead and the CPU are not worth it.
#
# The launcher supports exactly gzip and deflate: HttpClientProvider.cs sets
# AutomaticDecompression = GZip | Deflate and sends `Accept-Encoding: gzip,
# deflate`. It does NOT advertise br or zstd, so brotli/zstd modules would do
# nothing for the launcher today — see deploy/README.md before adding either.

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name launcher.samoy.love;

    # No Strict-Transport-Security here: HSTS delivered over plain HTTP is
    # ignored by browsers per RFC 6797.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve robots.txt and sitemap.xml over HTTP without redirect (for crawlers)
    location = /robots.txt {
        root /var/www/site;
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /sitemap.xml {
        root /var/www/site;
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    return 301 https://$host$request_uri;
}

#
# Main site: launcher.samoy.love
server {
    # nginx >= 1.25: `listen ... http2` is deprecated, HTTP/2 is enabled via the
    # separate `http2` directive.
    listen 443 ssl;
    http2 on;
    server_name launcher.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/launcher.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/launcher.samoy.love/privkey.pem;

    # Base security headers (see header comment). Inherited only by locations
    # that declare no add_header of their own; every other location repeats them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top

    # Enable strong cache validation
    etag on;

    # ---- Compression (see the COMPRESSION note at the top of this file) ----
    # Enabled here so every location inherits it; `location ^~ /content/`
    # turns it back off, which is the whole point of the arrangement.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # Vary: Accept-Encoding — required so caches/proxies never hand a gzipped
    # body to a client that did not ask for one.
    gzip_vary on;
    # Compress even when the request arrived through another proxy/CDN (with a
    # Via header). Without this, a future CDN in front would silently disable
    # compression for everything.
    gzip_proxied any;
    # text/html is ALWAYS compressed by nginx and must not be listed here
    # (listing it is a config error in some nginx versions).
    gzip_types
        application/json
        application/manifest+json
        application/javascript
        text/javascript
        application/x-javascript
        text/css
        text/plain
        text/xml
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        text/markdown
        application/wasm;
    gzip_disable "msie6";

    # Allow large uploads for admin endpoints at the server level so the limit
    # is applied before auth_request processing reads the request body
    client_max_body_size 30g;
    # Allow very long uploads over slow links
    client_body_timeout 6h;

    # Use default log format in server context; custom log_format must be defined at http-level
    access_log /var/log/nginx/launcher_access.log;
    error_log  /var/log/nginx/launcher_error.log;

    # Landing site static (from repository /landing)
    root /var/www/site;
    index index.html;

    # Unified /assets with fallback to news assets using internal prefix + root
    # 1) Try landing: /var/www/site/assets/<tail>
    # 2) Fallback (internal): /var/www/launcher/news/assets/<tail>
    location ~ ^/assets/(.*)$ {
        set $asset_tail $1;
        root /var/www/site;
        try_files /assets/$asset_tail @news_assets_fallback;
    }

    # Public feedback submit (no auth, proxied to admin backend)
    # Must appear BEFORE the protected /admin/api/ location
    location = /feedback/submit {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://127.0.0.1:55777;
        # Reasonable body size for feedback
        client_max_body_size 2m;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
    }
    location @news_assets_fallback {
        internal;
        # Re-map to news assets root, stripping '/assets/' prefix
        root /var/www/launcher/news/assets;
        # After root above, '/<tail>' resolves to /var/www/launcher/news/assets/<tail>
        try_files /$asset_tail =404;
    }

    # Public API (Go, :55700)
    location /api/ {
        proxy_pass http://127.0.0.1:55700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        access_log /var/log/nginx/launcher_api_access.log;
        error_log  /var/log/nginx/launcher_api_error.log;
    }

    # Internal auth gate for admin (uses backend verify endpoint)
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:55777/admin/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Admin API (Go, :55777)
    # Allow auth endpoints without auth_request
    location ^~ /admin/api/auth/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://127.0.0.1:55777;
    }

    # Unauthenticated health endpoint for liveness probes
    # Must appear BEFORE the protected /admin/api/ location
    location = /admin/api/health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://127.0.0.1:55777;
        # do not cache health responses
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
    }

    # Chunked upload endpoints: bypass auth_request and disable buffering
    location ^~ /admin/api/upload/ {
        client_max_body_size 30g;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_pass http://127.0.0.1:55777;
    }

    # High-throughput upload endpoint: bypass auth_request to avoid nginx buffering of request body
    # Auth is enforced inside the Go handler (handleUploadStream)
    location = /admin/api/uploadStream {
        client_max_body_size 30g;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_pass http://127.0.0.1:55777;
    }

    # Protected admin API
    location /admin/api/ {
        client_max_body_size 30g;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        auth_request /_auth;

        proxy_pass http://127.0.0.1:55777;
    }

    # Admin UI (static). Serve via nginx from /var/www/launcher/admin_ui
    # Use simple prefix location (no ^~) so regex cache rules below can match
    location /admin/ui/ {
        alias /var/www/launcher/admin_ui/;
    }
    location = /admin {
        return 302 /admin/;
    }
    # Serve only the root /admin/ (admin.html) via try_files rooted at admin_ui
    # This works well for both GET and HEAD and avoids proxying
    # Protect admin UI entrypoint with auth_request; login page is under /admin/ui/login.html (not protected)
    location = /admin/ {
        auth_request /_auth;
        error_page 401 =302 /admin/ui/login.html;
        root /var/www/launcher/admin_ui;
        try_files /admin.html =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
        # Enforcing — see the CONTENT SECURITY POLICY comment at the top of this
        # file for the per-directive justification (static audit of admin_ui).
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self'" always;
    }

    # Landing HTML should never be cached by browsers
    location = / {
        root /var/www/site;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://placehold.co; connect-src 'self'" always;
    }
    location = /index.html {
        root /var/www/site;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://placehold.co; connect-src 'self'" always;
    }
    # Admin UI assets and HTML (placed BEFORE generic static to ensure correct alias handling)
    # Use capture + alias to map /admin/ui/<path> to /var/www/launcher/admin_ui/<path>
    # 1) Hashed assets (long cache)
    # The regex is DOUBLE-QUOTED so the {8,} quantifier survives nginx's config
    # parser. Do not "escape" the braces instead — see the note on the landing
    # equivalent below; \{8,\} is a literal brace sequence in PCRE and the
    # location silently never matches.
    location ~* "^/admin/ui/(.+\.[a-f0-9]{8,}\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot))$" {
        alias /var/www/launcher/admin_ui/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
    }
    # 2) Other static assets (revalidate)
    location ~* ^/admin/ui/(.+\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot))$ {
        alias /var/www/launcher/admin_ui/$1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
    }
    # 3) Admin UI HTML (no-cache)
    location ~* ^/admin/ui/(.+\.html)$ {
        alias /var/www/launcher/admin_ui/$1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
        # Enforcing — see the CONTENT SECURITY POLICY comment at the top of this
        # file for the per-directive justification (static audit of admin_ui).
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self'" always;
    }

    # Static assets caching for landing site (placed AFTER admin UI blocks)
    # 1) Files with content hashes in name: long-lived immutable cache
    #
    # The `{8,}` quantifier collides with nginx's block delimiters, so the regex
    # must be DOUBLE-QUOTED. It used to be written as `\{8,\}` instead — that
    # passes `nginx -t`, but PCRE reads `\{` as a *literal* brace, so the pattern
    # demanded a filename containing the four characters `{8,}`. Both hashed-asset
    # locations therefore never matched anything and every hashed asset fell
    # through to the `must-revalidate` block below, losing the immutable
    # year-long cache. Verified with a real nginx (see deploy/nginx-check.sh):
    # /assets/app.a1b2c3d4.css hits this block with quotes and misses it with
    # backslashes.
    location ~* "^/.+\.[a-f0-9]{8,}\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot)$" {
        root /var/www/site;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
    }
    # 2) Other static files (no hash): revalidate using ETag/Last-Modified
    location ~* ^/.+\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot)$ {
        root /var/www/site;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
    }
    # HTML remains non-cacheable
    location ~* ^/.+\.(?:html)$ {
        root /var/www/site;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://placehold.co; connect-src 'self'" always;
    }
    # No generic /admin/ proxy; API is under /admin/api/ only

    # Content storage (large files) — use ^~ to prevent regex locations from taking over
    location ^~ /content/ {
        alias /var/www/launcher/content/;
        # Large files: revalidate via ETag to ensure integrity without stale caching
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
        # Compression MUST stay off here. Game payloads are already-compressed
        # archives (gzip gains ~0%), gzip would disable the sendfile/directio
        # fast path below, and — the hard blocker — it would break the
        # launcher's Range-based resume of interrupted multi-GiB downloads.
        # See the COMPRESSION note at the top of this file.
        gzip off;
        sendfile on;
        tcp_nopush on;
        directio 8m;
        open_file_cache max=10000 inactive=30s;
        access_log /var/log/nginx/launcher_content_access.log;
        error_log  /var/log/nginx/launcher_content_error.log;
    }

    # Manifests (JSON, icons) — high priority and fast local file delivery
    location ^~ /manifests/ {
        alias /var/www/launcher/manifests/;
        # Use short caching with revalidation to avoid repeated full fetches while keeping updates responsive
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
        # gzip is inherited from the server level and is the main reason this
        # location exists in the compression story: a real manifest shrinks
        # 905 549 B -> 272 404 B (3.32x). nginx will not use sendfile() for the
        # compressed .json responses (it has to run them through the gzip
        # filter), which is fine — manifests are ~1 MB, not gigabytes. sendfile
        # still applies to the icons served from the same tree.
        #
        # NOTE(owner): the CPU cost is paid on every manifest request. If that
        # ever shows up in `top`, the zero-CPU alternative is to precompress
        # manifests at publish time and add `gzip_static on;` here — nginx then
        # serves <name>.json.gz verbatim. Not enabled by default because it
        # requires ngx_http_gzip_static_module (check with
        # `nginx -V 2>&1 | tr ' ' '\n' | grep gzip_static`) AND a publisher-side
        # change to write the .gz files. See deploy/README.md.
        #
        # Cache-Control above is unaffected: gzip_vary adds `Vary:
        # Accept-Encoding`, so revalidation with ETag keeps working per-encoding.
        # Fast local file serving and metadata caching
        sendfile on;
        tcp_nopush on;
        open_file_cache max=10000 inactive=30s;
    }

    # News (markdown, json) — protect from regex static handlers with ^~
    location ^~ /news/ {
        alias /var/www/launcher/news/;
        # gzip inherited from the server level: index.json and any *.json here
        # are compressed. Article bodies are *.md, for which stock nginx has no
        # mime.types entry, so they are served as application/octet-stream and
        # therefore NOT compressed. That is deliberate — they are a few KB each,
        # and overriding `types` inside this location would replace (not extend)
        # the MIME map for everything else served from the same tree.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=300" always;  # short on purpose — see HSTS ramp-up note at top
    }

    # (Optional) explicit news assets path still works via fallback; dedicated block not required
}
