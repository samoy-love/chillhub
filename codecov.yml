# Что именно считается покрытием — и почему это не очевидно.
#
# У репозитория два независимых набора тестов на разных языках: сервер на Go
# и клиент на Rust. Пока покрытие клиента не собиралось, бейдж в README считал
# только сервер — и отвечал не на тот вопрос, который читатель ему задаёт.
# Флаги ниже держат оба слагаемых раздельно, чтобы «упало покрытие» всегда
# указывало на конкретную половину.

# ТРИ ОТЧЁТА, И СТАТУС НАДО СЧИТАТЬ ПОСЛЕ ВСЕХ ТРЁХ.
#
# Веб, сервер и клиент собираются в разных job и приезжают в Codecov по
# отдельности, причём клиентский — последним: его отправляет отдельная лёгкая
# job на ubuntu (грузить с windows-раннера стоило 57 секунд), и та ждёт
# Rust coverage на Windows.
#
# По умолчанию Codecov считает статус на первом же отчёте. Тогда в сравнении
# участвует только часть кода, и codecov/project падает с «-36%» — не потому
# что покрытие упало, а потому что остальные половины ещё в пути.
#
# Число обязано совпадать с числом флагов ниже. Пока здесь стояло 2, а флагов
# было три, статус считался ДО клиентского отчёта — то есть ровно тот отказ,
# ради которого настройка и заведена, только с третьим слагаемым.
codecov:
  notify:
    after_n_builds: 3

coverage:
  status:
    project:
      default:
        # Порог, а не «ни шагу назад»: покрытие естественно колеблется на
        # десятые доли при любой правке, и статус, падающий от шума, через
        # неделю начинают игнорировать.
        threshold: 1%
    patch:
      default:
        # С новым кодом строже, чем со старым: догонять покрытие задним
        # числом никто не станет, а не дать ему просесть — дёшево.
        target: 70%
        threshold: 5%

# ТРИ НЕЗАВИСИМЫХ НАБОРА КОДА, ТРИ ФЛАГА.
#
# Пока флага web не было, лендинг и морда админки не входили в счёт вовсе:
# бейдж показывал покрытие сервера и читался как покрытие проекта. Теперь
# каждое слагаемое видно отдельно, и «упало покрытие» указывает на конкретное.
flags:
  server:
    paths:
      - server/cmd/
      - server/internal/
    carryforward: true
  launcher:
    paths:
      - launcher/ChillHub.Native/src/
    carryforward: true
  web:
    paths:
      - server/admin_ui/
      - landing/
    carryforward: true

# Generated Slint code and pinned dependencies are not application coverage.
ignore:
  - "launcher/ChillHub.Native/vendor/**"
  - "**/target/**"
  - "**/tests/**"
  - "**/controller_tests.rs"
  - "scripts/**"
  - "docs/**"

comment:
  layout: "reach, diff, flags"
  require_changes: true
