# Что именно считается покрытием — и почему это не очевидно.
#
# У репозитория два независимых набора тестов на разных языках: сервер на Go
# и клиент на C#. Пока покрытие клиента не собиралось, бейдж в README считал
# только сервер — и отвечал не на тот вопрос, который читатель ему задаёт.
# Флаги ниже держат оба слагаемых раздельно, чтобы «упало покрытие» всегда
# указывало на конкретную половину.

# ДВА ОТЧЁТА, И СТАТУС НАДО СЧИТАТЬ ПОСЛЕ ОБОИХ.
#
# Сервер и клиент собираются в разных job и приезжают в Codecov по отдельности,
# причём клиентский — заметно позже: его отправляет отдельная лёгкая job на
# ubuntu (грузить с windows-раннера стоило 57 секунд).
#
# По умолчанию Codecov считает статус на первом же отчёте. Тогда в сравнении
# участвует только сервер, и codecov/project падает с «-36%» — не потому что
# покрытие упало, а потому что вторая половина ещё в пути. Дождаться обоих.
codecov:
  notify:
    after_n_builds: 2

coverage:
  status:
    project:
      default:
        # Порог, а не «ни шагу назад»: покрытие естественно колеблется на
        # десятые доли при любой правке, и статус, падающий от шума, через
        # неделю начинают игнорировать.
        threshold: 1%
    patch:
      default:
        # С новым кодом строже, чем со старым: догонять покрытие задним
        # числом никто не станет, а не дать ему просесть — дёшево.
        target: 70%
        threshold: 5%

# ТРИ НЕЗАВИСИМЫХ НАБОРА КОДА, ТРИ ФЛАГА.
#
# Пока флага web не было, лендинг и морда админки не входили в счёт вовсе:
# бейдж показывал покрытие сервера и читался как покрытие проекта. Теперь
# каждое слагаемое видно отдельно, и «упало покрытие» указывает на конкретное.
flags:
  server:
    paths:
      - server/cmd/
      - server/internal/
    carryforward: true
  launcher:
    paths:
      - launcher/
      # Апдейтер отдельного набора тестов не имеет: его проверяет ChillHub.Tests,
      # и его строки приезжают в том же отчёте, что и клиентские. Без этой строки
      # они попадали бы в общий счёт, но мимо флага — и «упало покрытие клиента»
      # перестало бы замечать половину пути обновления.
      - updater/
    carryforward: true
  web:
    paths:
      - server/admin_ui/
      - landing/
    carryforward: true

# Из знаменателя убрано только то, что НЕЛЬЗЯ покрыть тестами: сгенерированное
# компилятором и служебное. Лендинг и морда админки отсюда УБРАНЫ намеренно —
# пока они были в ignore, непроверенный код просто не попадал в счёт, и процент
# был высоким ровно потому, что часть кода не считали.
#
# updater/ раньше стоял здесь же: у него не было тестового проекта, только
# консольная самопроверка ManifestPreserveCheck, и исключение держали до тех
# пор, пока не появятся настоящие тесты. Они появились — апдейтер проверяется
# из ChillHub.Tests и покрыт лучше клиента. Держать его в ignore дальше значило
# бы прятать не дыру, а как раз проверенный код: апдейтер кладёт файлы поверх
# работающего лаунчера, и его покрытие — ровно то, что читатель бейджа хочет
# видеть больше всего.
#
# *.xaml — иной случай, и не про дыру в тестах, а про то, что WPF-компилятор
# привязывает разметку к покрытию через #line в сгенерированном InitializeComponent:
# строка объявления Button или TextBox засчитывается «покрытой», если конструктор
# страницы вообще выполнился, — не потому, что тест проверил именно эту кнопку.
# Любая перестановка строк в XAML (обёрнуть в Grid, добавить комментарий) сдвигает
# номера объявлений, и codecov/patch видит на новом месте нулевой хит — хотя
# поведение не изменилось и InitializeComponent выполняет эти строки как и раньше.
# Ровно так падала правка вёрстки в #71: у TextBox и Button не появилось нового
# непроверенного пути, просто сдвинулась строка. Реальную логику в code-behind
# (*.xaml.cs) это не касается и продолжает считаться как раньше.
ignore:
  - "**/*.xaml"
  - "**/obj/**"
  - "**/bin/**"
  - "**/*.Designer.cs"
  - "scripts/**"
  - "docs/**"

comment:
  layout: "reach, diff, flags"
  require_changes: true
